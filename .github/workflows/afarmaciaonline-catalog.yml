# GirlMath — A Farmácia Online daily price refresh
# ============================================================
# afarmaciaonline.pt é Magento. Scraper usa HTTP simples (fetch) + parse
# JSON-LD + data-layer (GTIN-13 real) — sem Playwright/ScrapingBee.
# ~7.5k URLs .html × ~300ms com concurrency=5 ≈ 25 min.
#
# Pipeline:
#   1. scrape-afarmaciaonline-catalog.js  → data/catalog/afarmaciaonline-full.json
#   2. integrate-afarmaciaonline-catalog.js → match por EAN-real + fingerprint
#      (v1: só enriquece produtos existentes; NÃO cria SKUs novos)
#   3. inject-seed-into-demo.js (corre dentro do integrate) → regenera HTML

name: A Farmácia Online daily refresh

on:
  schedule:
    # 18h UTC — depois de Farmácia.pt (17h)
    - cron: '0 18 * * *'
    - cron: '0 6 * * *'   # 2x/dia: preços <12h stale (regra do user 2026-07-03)
  workflow_dispatch:
    inputs:
      limit:
        description: 'Limit (vazio = sem limite, útil para teste)'
        required: false
        default: ''

permissions:
  contents: write   # push do seed + HTML actualizados
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install deps
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Scrape A Farmácia Online catalog
        run: |
          if [ -n "${{ github.event.inputs.limit }}" ]; then
            node scripts/scrape-afarmaciaonline-catalog.js --limit=${{ github.event.inputs.limit }}
          else
            node scripts/scrape-afarmaciaonline-catalog.js
          fi

      - name: Upload scrape artifact (safety-net)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: afarmaciaonline-catalog-${{ github.run_id }}
          path: data/catalog/afarmaciaonline-full.json
          retention-days: 14

      - name: Integrate into seed
        run: node scripts/integrate-afarmaciaonline-catalog.js

      - name: Commit changes
        env:
          GIT_AUTHOR_NAME: GirlMath Bot
          GIT_AUTHOR_EMAIL: bot@girlmath.pt
          GIT_COMMITTER_NAME: GirlMath Bot
          GIT_COMMITTER_EMAIL: bot@girlmath.pt
        run: |
          set -e
          if git diff --quiet -- data/seed-bundle.json demo.html index.html catalogo.html; then
            echo "Nenhuma alteração — nada a fazer."
            exit 0
          fi
          git add data/seed-bundle.json demo.html index.html catalogo.html
          git add -f data/catalog/afarmaciaonline-full.json 2>/dev/null || true
          DATE=$(date -u +%Y-%m-%d)
          git commit -m "chore: A Farmácia Online daily refresh ($DATE)" \
            -m "Auto-update via GitHub Actions. Sem mexer noutras lojas."

      - name: Push to main (resilient — re-integra sobre origin em conflito)
        run: |
          set -e
          bash scripts/ci/resilient-push.sh \
            "node scripts/integrate-afarmaciaonline-catalog.js" \
            "chore: A Farmácia Online daily refresh ($(date -u +%Y-%m-%d))" \
            data/catalog/afarmaciaonline-full.json
