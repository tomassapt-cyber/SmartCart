# CosMath — fichas sem EAN juntas às fichas com EAN (2026-11-16, ponto 6 da auditoria)
# =====================================================================================
# Regenera data/product-aliases-auto.json (código inventado da SweetCare/Wells/… →
# EAN do mesmo produto) com as regras estritas de scripts/aliases-sinteticos.js. A
# fusão faz-se na publicação (scripts/dedup-ean-variants.js), por isso basta gravar o
# ficheiro: a corrida seguinte de cada loja e o db-sync já o usam. Uma vez por semana
# chega: os pares só mudam quando aparecem produtos novos.
#
# 2026-11-17: a seguir, regenera data/product-aliases-cnp.json (scripts/aliases-cnp.js):
# fichas do mesmo produto com códigos de barras diferentes (embalagem nova), ligadas
# pelo mesmo CNP nas farmácias. Corre depois dos sintéticos porque não toca em códigos
# que já estejam num par deles.
name: Aliases das fichas sem EAN e pelo CNP

on:
  schedule:
    - cron: '40 4 * * 0'   # domingo
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aliases:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
      NODE_OPTIONS: '--max-old-space-size=4096'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Descomprimir o catalogo
        run: bash scripts/ci/seed.sh unpack

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Teste
        run: |
          node scripts/test-aliases-sinteticos.cjs
          node scripts/test-aliases-cnp.cjs

      - name: Gerar os aliases
        run: |
          node scripts/aliases-sinteticos.js
          node scripts/aliases-cnp.js

      - name: Commit + push
        env:
          GIT_AUTHOR_NAME: CosMath Bot
          GIT_AUTHOR_EMAIL: bot@cosmath.pt
          GIT_COMMITTER_NAME: CosMath Bot
          GIT_COMMITTER_EMAIL: bot@cosmath.pt
        run: |
          set -e
          # a data de geração muda sempre: só conta se os pares mudaram
          if git diff --quiet -I '"_gerado"' -- data/product-aliases-auto.json data/product-aliases-cnp.json; then
            echo "Pares iguais — nada a fazer."
            exit 0
          fi
          git add data/product-aliases-auto.json data/product-aliases-cnp.json
          git commit -m "chore: aliases das fichas sem EAN e pelo CNP ($(date -u +%Y-%m-%d))" \
            -m "Gerado por scripts/aliases-sinteticos.js e scripts/aliases-cnp.js. Auto via GitHub Actions."
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0
            sleep $((i * 15))
          done
          exit 1
