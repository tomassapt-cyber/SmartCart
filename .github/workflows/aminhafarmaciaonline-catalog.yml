# GirlMath — A Minha Farmácia Online daily price refresh
# ============================================================
# aminhafarmaciaonline.pt — WooCommerce (WoodMart). JSON-LD válido com gtin13
# (EAN real parcial), offers.priceSpecification[].price, e BreadcrumbList
# (categoria fiável). Scrape SÓ /beleza/ (~1234 produtos dermo-cosmética).
# Match híbrido seguro: EAN(gtin13) + nome+volume + fuzzy guardado (jaccard>=0.7).
#
# Pipeline:
#   1. scrape-aminhafarmaciaonline-catalog.js → data/catalog/aminhafarmaciaonline-full.json
#   2. integrate-aminhafarmaciaonline-catalog.js → match híbrido (v1: só enriquece)
#   3. inject-seed-into-demo.js (dentro do integrate) → regenera HTML

name: A Minha Farmácia Online daily refresh

on:
  schedule:
    # 21h30 UTC — depois da A Sua Farmácia Online (21h)
    - cron: '30 21 * * *'
    - cron: '30 5 * * *'   # 3x/dia (regra do user 2026-07-03)
    - cron: '30 13 * * *'   # 3x/dia
  workflow_dispatch:
    inputs:
      limit:
        description: 'Limit (vazio = sem limite)'
        required: false
        default: ''

permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
      NODE_OPTIONS: '--max-old-space-size=4096'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install deps
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Scrape A Minha Farmácia Online catalog (/beleza/)
        run: |
          if [ -n "${{ github.event.inputs.limit }}" ]; then
            node scripts/scrape-aminhafarmaciaonline-catalog.js --limit=${{ github.event.inputs.limit }} --concurrency=5 --delay=250
          else
            node scripts/scrape-aminhafarmaciaonline-catalog.js --concurrency=5 --delay=250
          fi

      - name: Upload scrape artifact (safety-net)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aminhafarmaciaonline-catalog-${{ github.run_id }}
          path: data/catalog/aminhafarmaciaonline-full.json
          retention-days: 14

      - name: Integrate into seed
        run: node scripts/integrate-aminhafarmaciaonline-catalog.js

      - name: Commit changes
        env:
          GIT_AUTHOR_NAME: GirlMath Bot
          GIT_AUTHOR_EMAIL: bot@girlmath.pt
          GIT_COMMITTER_NAME: GirlMath Bot
          GIT_COMMITTER_EMAIL: bot@girlmath.pt
        run: |
          set -e
          if git diff --quiet -- data/seed-bundle.json demo.html index.html catalogo.html; then
            echo "Nenhuma alteração — nada a fazer."
            exit 0
          fi
          git add data/seed-bundle.json demo.html index.html catalogo.html
          git add -f data/catalog/aminhafarmaciaonline-full.json 2>/dev/null || true
          DATE=$(date -u +%Y-%m-%d)
          git commit -m "chore: A Minha Farmácia Online daily refresh ($DATE)" \
            -m "Auto-update via GitHub Actions. Sem mexer noutras lojas."

      - name: Push to main (resilient — re-integra sobre origin em conflito)
        run: |
          set -e
          bash scripts/ci/resilient-push.sh \
            "node scripts/integrate-aminhafarmaciaonline-catalog.js" \
            "chore: A Minha Farmácia Online daily refresh ($(date -u +%Y-%m-%d))" \
            data/catalog/aminhafarmaciaonline-full.json
