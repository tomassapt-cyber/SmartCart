# CosMath — Auchan (loja 76) · refresh 3x/dia
# ============================================================
# Salesforce Commerce Cloud. Preços em bloco pelo Search-UpdateGrid (200
# produtos por pedido, ~14 mil produtos em «Beleza, Higiene e Bebé» e «Saúde e
# Bem-estar»); o EAN vem da ficha e guarda-se por produto, por isso cada corrida
# só abre as fichas que ainda não conhece (até 3.000). A primeira passagem
# completa espalha-se por ~5 corridas; depois disso é quase só preços.
#
# Pipeline:
#   1. scrape-auchan-catalog.js → data/catalog/auchan-full.json
#   2. guardar o catálogo (os EAN lidos nunca se perdem, mesmo se a integração falhar)
#   3. integrate-auchan-catalog.js (EAN / fingerprint / novos dermo + pós-processo)

name: Auchan daily refresh

on:
  schedule:
    - cron: '50 6 * * *'
    - cron: '50 14 * * *'
    - cron: '50 22 * * *'
  workflow_dispatch:
    inputs:
      max_fichas:
        description: 'Máximo de fichas a abrir para ler EAN (vazio = 3000)'
        required: false
        default: ''
      teste:
        description: '1 = só recolher, não publicar nada (teste de acesso)'
        required: false
        default: ''

permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
      NODE_OPTIONS: '--max-old-space-size=4096'
      COSMATH_SKIP_HP: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Descomprimir o catalogo
        run: bash scripts/ci/seed.sh unpack

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install deps
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Scrape Auchan
        run: |
          MAX="${{ github.event.inputs.max_fichas }}"
          node scripts/scrape-auchan-catalog.js --max-fichas=${MAX:-3000}

      - name: Upload scrape artifact (safety-net)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auchan-catalog-${{ github.run_id }}
          path: data/catalog/auchan-full.json
          retention-days: 14

      # O mapa pid → EAN é o que custa tempo a construir (uma ficha por produto).
      # Guardá-lo ANTES de integrar faz com que nunca se perca — ver o mesmo passo
      # e a razão em caretobeauty-catalog.yml.
      - name: Guardar o catalogo recolhido (antes de integrar)
        if: github.event.inputs.teste == ''
        env:
          GIT_AUTHOR_NAME: CosMath Bot
          GIT_AUTHOR_EMAIL: bot@cosmath.pt
          GIT_COMMITTER_NAME: CosMath Bot
          GIT_COMMITTER_EMAIL: bot@cosmath.pt
        run: |
          set -e
          git add -f data/catalog/auchan-full.json
          if git diff --cached --quiet; then echo "catalogo sem alteracoes"; exit 0; fi
          git commit -m "chore: Auchan catalogo ($(date -u +%Y-%m-%d))" \
            -m "So o catalogo recolhido; a integracao no seed vem no passo seguinte."
          for i in 1 2 3 4 5; do
            if git push origin HEAD:main; then echo "catalogo guardado"; exit 0; fi
            git fetch origin main && git rebase origin/main || git rebase --abort || true
            # OBRIGATORIO depois de a arvore andar — ver caretobeauty-catalog.yml
            bash scripts/ci/seed.sh unpack
            sleep $((i * 10))
          done
          echo "AVISO: nao consegui guardar o catalogo; fica o artefacto"

      - name: Integrate into seed
        if: github.event.inputs.teste == ''
        run: node scripts/integrate-auchan-catalog.js

      - name: Commit changes
        if: github.event.inputs.teste == ''
        env:
          GIT_AUTHOR_NAME: CosMath Bot
          GIT_AUTHOR_EMAIL: bot@cosmath.pt
          GIT_COMMITTER_NAME: CosMath Bot
          GIT_COMMITTER_EMAIL: bot@cosmath.pt
        run: |
          set -e
          bash scripts/ci/seed.sh pack
          if git diff --quiet -- data/seed-bundle.json.gz demo.html; then
            echo "Nenhuma alteração — nada a fazer."
            exit 0
          fi
          git add data/seed-bundle.json.gz demo.html
          git add -f data/catalog/auchan-full.json 2>/dev/null || true
          git commit -m "chore: Auchan daily refresh ($(date -u +%Y-%m-%d))" \
            -m "Auto-update via GitHub Actions. Sem mexer noutras lojas."

      - name: Push to main (resilient — re-integra sobre origin em conflito)
        if: github.event.inputs.teste == ''
        run: |
          set -e
          bash scripts/ci/resilient-push.sh \
            "node scripts/integrate-auchan-catalog.js" \
            "chore: Auchan daily refresh ($(date -u +%Y-%m-%d))" \
            data/catalog/auchan-full.json
