# CosMath — Aveiro Farma daily price refresh
# ============================================================
# Aveiro Farma (aveirofarma.pt): OpenCart PT, preços EUR, envia PT. JSON-LD
# expõe gtin14=EAN real → match forte por EAN (como cocooncenter). Catálogo
# é maioria suplementos/genéricos — o scraper filtra --dermo por defeito
# (~6.5k de ~19.6k). O feed /feed_sitemap_products.xml demora ~20s a gerar
# no servidor (PHP 5.6 antigo) mas as fichas de produto respondem rápido.
#
# Pipeline:
#   1. scrape-aveirofarma-catalog.js → data/catalog/aveirofarma-full.json
#   2. integrate-aveirofarma-catalog.js (match EAN + pós-processo + inject)

name: Aveiro Farma daily refresh

on:
  schedule:
    - cron: '0 11 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Limit (vazio = sem limite)'
        required: false
        default: ''

permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
      NODE_OPTIONS: '--max-old-space-size=4096'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install deps
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Scrape Aveiro Farma (dermo)
        run: |
          if [ -n "${{ github.event.inputs.limit }}" ]; then
            node scripts/scrape-aveirofarma-catalog.js --limit=${{ github.event.inputs.limit }} --concurrency=5 --delay=250
          else
            node scripts/scrape-aveirofarma-catalog.js --concurrency=5 --delay=250
          fi

      - name: Upload scrape artifact (safety-net)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aveirofarma-catalog-${{ github.run_id }}
          path: data/catalog/aveirofarma-full.json
          retention-days: 14

      - name: Integrate into seed
        run: node scripts/integrate-aveirofarma-catalog.js

      - name: Commit changes
        env:
          GIT_AUTHOR_NAME: CosMath Bot
          GIT_AUTHOR_EMAIL: bot@cosmath.pt
          GIT_COMMITTER_NAME: CosMath Bot
          GIT_COMMITTER_EMAIL: bot@cosmath.pt
        run: |
          set -e
          if git diff --quiet -- data/seed-bundle.json demo.html index.html catalogo.html; then
            echo "Nenhuma alteração — nada a fazer."
            exit 0
          fi
          git add data/seed-bundle.json demo.html index.html catalogo.html
          git add -f data/catalog/aveirofarma-full.json 2>/dev/null || true
          DATE=$(date -u +%Y-%m-%d)
          git commit -m "chore: Aveiro Farma daily refresh ($DATE)" \
            -m "Auto-update via GitHub Actions. Sem mexer noutras lojas."

      - name: Push to main (resilient — re-integra sobre origin em conflito)
        run: |
          set -e
          bash scripts/ci/resilient-push.sh \
            "node scripts/integrate-aveirofarma-catalog.js" \
            "chore: Aveiro Farma daily refresh ($(date -u +%Y-%m-%d))" \
            data/catalog/aveirofarma-full.json
