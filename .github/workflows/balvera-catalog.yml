# CosMath — Balvera (loja 91) · refresh 2x/dia
# ============================================================
# Perfumaria portuguesa (Pombal), loja online Next.js: ~2.750 fichas com
# JSON-LD Product (gtin = EAN), lidas pela recolha genérica
# (scripts/lib/fichas-jsonld.js), 2 em paralelo, ~20 min por passagem.
# SÓ-PC: a Cloudflare bloqueia os runners (ver o schedule abaixo).
# Entrou a 2026-10-01: 1,00x a mediana, a mais barata em 20% dos comuns, 49% de
# EAN novos.

name: Balvera daily refresh

on:
  # ⚠️ SEM AGENDAMENTO NA NUVEM desde o 1.º dia (2026-10-01) — loja SÓ-PC
  # (scripts/refresh-pc-only.sh). Aos runners do GitHub a Cloudflare responde
  # 403 "Just a moment..." logo ao mapa do site; do PC responde 200. O botão
  # manual fica, para testar se o bloqueio passou.
  # schedule:
  #   - cron: '35 6 * * *'
  #   - cron: '35 18 * * *'
  workflow_dispatch:
    inputs:
      limite:
        description: 'Limite de produtos (vazio = todos) — para testar'
        required: false
        default: ''

permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
      NODE_OPTIONS: '--max-old-space-size=4096'
      # sem isto cada integração gasta ~5 min a regenerar a homepage (ver
      # caretobeauty-catalog.yml); a homepage é refeita 1x/dia noutro workflow
      COSMATH_SKIP_HP: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Descomprimir o catalogo
        run: bash scripts/ci/seed.sh unpack

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install deps
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Scrape Balvera
        run: |
          if [ -n "${{ github.event.inputs.limite }}" ]; then
            node scripts/scrape-balvera-catalog.js --limite=${{ github.event.inputs.limite }}
          else
            node scripts/scrape-balvera-catalog.js
          fi

      - name: Upload scrape artifact (safety-net)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: balvera-catalog-${{ github.run_id }}
          path: data/catalog/balvera-full.json
          retention-days: 14

      # Um teste com limite NÃO publica: ~40 produtos no seed apagariam as
      # ofertas das outras até à corrida seguinte.
      - name: Integrate into seed
        if: github.event.inputs.limite == ''
        run: node scripts/integrate-balvera-catalog.js

      - name: Commit changes
        if: github.event.inputs.limite == ''
        env:
          GIT_AUTHOR_NAME: CosMath Bot
          GIT_AUTHOR_EMAIL: bot@cosmath.pt
          GIT_COMMITTER_NAME: CosMath Bot
          GIT_COMMITTER_EMAIL: bot@cosmath.pt
        run: |
          set -e
          # Comprimir PRIMEIRO e testar o .gz: o .json está no .gitignore (ver
          # scripts/ci/seed.sh e caretobeauty-catalog.yml).
          bash scripts/ci/seed.sh pack
          if git diff --quiet -- data/seed-bundle.json.gz demo.html; then
            echo "Nenhuma alteração — nada a fazer."
            exit 0
          fi
          git add data/seed-bundle.json.gz demo.html
          git add -f data/catalog/balvera-full.json 2>/dev/null || true
          git commit -m "chore: Balvera daily refresh ($(date -u +%Y-%m-%d))" \
            -m "Auto-update via GitHub Actions. Sem mexer noutras lojas."

      - name: Push to main (resilient — re-integra sobre origin em conflito)
        if: github.event.inputs.limite == ''
        run: |
          set -e
          bash scripts/ci/resilient-push.sh \
            "node scripts/integrate-balvera-catalog.js" \
            "chore: Balvera daily refresh ($(date -u +%Y-%m-%d))" \
            data/catalog/balvera-full.json
