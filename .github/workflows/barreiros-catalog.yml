# GirlMath — Farmácia Barreiros daily price refresh
# ============================================================
# farmaciabarreiros.com — PrestaShop. ean13 + price_amount no JS da página
# (JSON-LD é só WebSite). ~2.5k produtos /beleza/ (dermo-cosmética, marcas
# francesas com forte overlap). Match dominante por EAN (GTIN-13 global).

name: Farmácia Barreiros daily refresh

on:
  schedule:
    # 22h30 UTC
    - cron: '30 22 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Limit (vazio = sem limite)'
        required: false
        default: ''

permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
      NODE_OPTIONS: '--max-old-space-size=4096'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install deps
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Scrape Farmácia Barreiros catalog (/beleza/)
        run: |
          if [ -n "${{ github.event.inputs.limit }}" ]; then
            node scripts/scrape-barreiros-catalog.js --limit=${{ github.event.inputs.limit }} --concurrency=5 --delay=250
          else
            node scripts/scrape-barreiros-catalog.js --concurrency=5 --delay=250
          fi

      - name: Upload scrape artifact (safety-net)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: barreiros-catalog-${{ github.run_id }}
          path: data/catalog/barreiros-full.json
          retention-days: 14

      - name: Integrate into seed
        run: node scripts/integrate-barreiros-catalog.js

      - name: Commit changes
        env:
          GIT_AUTHOR_NAME: GirlMath Bot
          GIT_AUTHOR_EMAIL: bot@girlmath.pt
          GIT_COMMITTER_NAME: GirlMath Bot
          GIT_COMMITTER_EMAIL: bot@girlmath.pt
        run: |
          set -e
          if git diff --quiet -- data/seed-bundle.json demo.html index.html catalogo.html; then
            echo "Nenhuma alteração — nada a fazer."
            exit 0
          fi
          git add data/seed-bundle.json demo.html index.html catalogo.html
          git add -f data/catalog/barreiros-full.json 2>/dev/null || true
          DATE=$(date -u +%Y-%m-%d)
          git commit -m "chore: Farmácia Barreiros daily refresh ($DATE)" \
            -m "Auto-update via GitHub Actions. Sem mexer noutras lojas."

      - name: Push to main (resilient — re-integra sobre origin em conflito)
        run: |
          set -e
          bash scripts/ci/resilient-push.sh \
            "node scripts/integrate-barreiros-catalog.js" \
            "chore: Farmácia Barreiros daily refresh ($(date -u +%Y-%m-%d))" \
            data/catalog/barreiros-full.json
