# CosMath — Care to Beauty daily price refresh
# ============================================================
# Magento com JSON-LD por ficha (como a atida). 16.119 URLs depois do filtro,
# ~40 min a 4 em paralelo. EAN (gtin) E CNP (sku) na mesma ficha.
# SO o prefixo /pt/ — a loja e multi-pais e o preco depende disso.
# 2x/dia (e grande); o --resume retoma se rebentar a meio.

# Pipeline:
#   1. scrape-caretobeauty-catalog.js → data/catalog/caretobeauty-full.json
#   2. integrate-caretobeauty-catalog.js (match EAN/CNP + pós-processo + inject)

name: Care to Beauty daily refresh

on:
  schedule:
    # 2x/dia e nao 3x como as lojas pequenas: sao 16 mil fichas, ~40 min cada
    # passagem. Horarios afastados dos das outras lojas para nao competirem
    # pelos executores do GitHub.
    - cron: '10 2 * * *'
    - cron: '10 16 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Limit (vazio = sem limite)'
        required: false
        default: ''
      resume:
        description: 'Retomar do catálogo committed (1 = sim; vazio = scrape completo)'
        required: false
        default: ''

permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
      NODE_OPTIONS: '--max-old-space-size=4096'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install deps
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Scrape Care to Beauty
        run: |
          # [2026-07-30] O $RESUME era calculado e NUNCA usado — o botao
          # "Retomar" da interface nao fazia nada. Na Care to Beauty isso
          # custava 57 min de recolha repetida (run 30561862354).
          RESUME=""
          if [ -n "${{ github.event.inputs.resume }}" ]; then RESUME="--resume"; fi
          if [ -n "${{ github.event.inputs.limit }}" ]; then
            node scripts/scrape-caretobeauty-catalog.js --limit=${{ github.event.inputs.limit }} $RESUME
          else
            node scripts/scrape-caretobeauty-catalog.js $RESUME
          fi

      - name: Upload scrape artifact (safety-net)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: caretobeauty-catalog-${{ github.run_id }}
          path: data/catalog/caretobeauty-full.json
          retention-days: 14

      # A recolha demora ~60 min. Guardá-la no seu proprio commit, ANTES da
      # integracao, faz com que nunca se perca: e um ficheiro pequeno e o
      # push e quase instantaneo, logo ganha a corrida contra os outros bots.
      # Se a integracao a seguir perder a corrida, a execucao seguinte
      # retoma isto com --resume em segundos em vez de re-raspar 16 mil
      # fichas. (Aprendido no run 30551673295, cancelado ao fim de 120 min
      # com a recolha ja feita e deitada fora.)
      - name: Guardar o catalogo recolhido (antes de integrar)
        env:
          GIT_AUTHOR_NAME: CosMath Bot
          GIT_AUTHOR_EMAIL: bot@cosmath.pt
          GIT_COMMITTER_NAME: CosMath Bot
          GIT_COMMITTER_EMAIL: bot@cosmath.pt
        run: |
          set -e
          git add -f data/catalog/caretobeauty-full.json
          if git diff --cached --quiet; then
            echo "catalogo sem alteracoes"
            exit 0
          fi
          git commit -m "chore: Care to Beauty catalogo ($(date -u +%Y-%m-%d))" \
            -m "So o catalogo recolhido; a integracao no seed vem no passo seguinte."
          # tentativas curtas: se nao entrar, o artefacto continua a servir de rede
          for i in 1 2 3 4 5; do
            if git push origin HEAD:main; then echo "catalogo guardado"; exit 0; fi
            git fetch origin main && git rebase origin/main || git rebase --abort || true
            sleep $((i * 10))
          done
          echo "AVISO: nao consegui guardar o catalogo; fica o artefacto"

      - name: Integrate into seed
        run: node scripts/integrate-caretobeauty-catalog.js

      - name: Commit changes
        env:
          GIT_AUTHOR_NAME: CosMath Bot
          GIT_AUTHOR_EMAIL: bot@cosmath.pt
          GIT_COMMITTER_NAME: CosMath Bot
          GIT_COMMITTER_EMAIL: bot@cosmath.pt
        run: |
          set -e
          if git diff --quiet -- data/seed-bundle.json demo.html; then
            echo "Nenhuma alteração — nada a fazer."
            exit 0
          fi
          git add data/seed-bundle.json demo.html
          git add -f data/catalog/caretobeauty-full.json 2>/dev/null || true
          DATE=$(date -u +%Y-%m-%d)
          git commit -m "chore: Care to Beauty daily refresh ($DATE)" \
            -m "Auto-update via GitHub Actions. Sem mexer noutras lojas."

      - name: Push to main (resilient — re-integra sobre origin em conflito)
        run: |
          set -e
          bash scripts/ci/resilient-push.sh \
            "node scripts/integrate-caretobeauty-catalog.js" \
            "chore: Care to Beauty daily refresh ($(date -u +%Y-%m-%d))" \
            data/catalog/caretobeauty-full.json
