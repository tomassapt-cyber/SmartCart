# CosMath — Continente Online (loja de COMPARAÇÃO, não cria produtos)
# ============================================================
# continente.pt NÃO expõe gtin — o integrador casa por FINGERPRINT (marca+nome)
# com guard de volume e entra SÓ como fonte de preço sobre produtos existentes.
# O catálogo tem ~104k páginas; a whitelist de marcas beleza reduz a ~4.5k.
#
# CADÊNCIA (2026-07-05): os crons DIÁRIOS correm em modo KNOWN-ONLY — só
# refrescam os URLs das ofertas que já temos (rápido, <1min). Um cron SEMANAL
# (--full --resume) faz o scan completo para descobrir novos matches. Isto
# resolve o timeout de 30min (o scan completo não cabia).

name: Continente Online refresh

on:
  schedule:
    - cron: '15 2 * * *'      # diário known-only (rápido)
    - cron: '15 10 * * *'
    - cron: '15 18 * * *'
    - cron: '0 4 * * 1'       # SEMANAL (segunda 04h UTC) — scan completo --full
  workflow_dispatch:
    inputs:
      limit:
        description: 'Limit (vazio = sem limite, útil para teste)'
        required: false
        default: ''
      full:
        description: 'true = scan completo (descobrir novos matches)'
        required: false
        default: ''

permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
      NODE_OPTIONS: '--max-old-space-size=4096'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install deps
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Scrape Continente Online
        run: |
          if [ -n "${{ github.event.inputs.limit }}" ]; then
            node scripts/scrape-continente-catalog.js --limit=${{ github.event.inputs.limit }}
          elif [ "${{ github.event.schedule }}" = "0 4 * * 1" ] || [ -n "${{ github.event.inputs.full }}" ]; then
            node scripts/scrape-continente-catalog.js --full --resume
          else
            node scripts/scrape-continente-catalog.js
          fi

      - name: Upload scrape artifact (safety-net)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: continente-catalog-${{ github.run_id }}
          path: data/catalog/continente-full.json
          retention-days: 14

      - name: Integrate into seed
        run: node scripts/integrate-continente-catalog.js

      - name: Commit changes
        env:
          GIT_AUTHOR_NAME: CosMath Bot
          GIT_AUTHOR_EMAIL: bot@cosmath.pt
          GIT_COMMITTER_NAME: CosMath Bot
          GIT_COMMITTER_EMAIL: bot@cosmath.pt
        run: |
          set -e
          if git diff --quiet -- data/seed-bundle.json demo.html; then
            echo "Nenhuma alteração — nada a fazer."
            exit 0
          fi
          git add data/seed-bundle.json demo.html
          git add -f data/catalog/continente-full.json 2>/dev/null || true
          DATE=$(date -u +%Y-%m-%d)
          git commit -m "chore: Continente Online daily refresh ($DATE)" \
            -m "Auto-update via GitHub Actions. Sem mexer noutras lojas."

      - name: Push to main (resilient — re-integra sobre origin em conflito)
        run: |
          set -e
          bash scripts/ci/resilient-push.sh \
            "node scripts/integrate-continente-catalog.js" \
            "chore: Continente Online daily refresh ($(date -u +%Y-%m-%d))" \
            data/catalog/continente-full.json
