# CosMath — Continente Online (loja de COMPARAÇÃO, não cria produtos)
# ============================================================
# Desde 2026-11-18 o JSON-LD traz o gtin13: o integrador casa primeiro pelo EAN e só
# usa o FINGERPRINT (marca+nome, guarda de volume) nas fichas sem EAN. Entra SÓ como
# fonte de preço sobre produtos existentes. O mapa tem ~68k produtos; a whitelist de
# marcas de beleza reduz a ~2,6k. Identificação honesta (UA do CosMath) desde 18/11.
# Leitura completa garantida: se a última tiver mais de 7 dias, a corrida diária
# faz uma (o cron semanal de segunda nem sempre corre).
#
# CADÊNCIA (2026-07-05): os crons DIÁRIOS correm em modo KNOWN-ONLY — só
# refrescam os URLs das ofertas que já temos (rápido, <1min). Um cron SEMANAL
# (--full --resume) faz o scan completo para descobrir novos matches. Isto
# resolve o timeout de 30min (o scan completo não cabia).

name: Continente Online refresh

on:
  schedule:
    - cron: '15 2 * * *'      # diário known-only (rápido)
    - cron: '15 10 * * *'
    - cron: '15 18 * * *'
    - cron: '0 4 * * 1'       # SEMANAL (segunda 04h UTC) — scan completo --full
  # ensaio na nuvem no próprio PR (30 fichas, sem publicar): mostra se o Continente aceita o UA do CosMath
  pull_request:
    paths:
      - 'scripts/scrape-continente-catalog.js'
      - 'scripts/integrate-continente-catalog.js'
      - '.github/workflows/continente-catalog.yml'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Limit (vazio = sem limite, útil para teste)'
        required: false
        default: ''
      full:
        description: 'true = scan completo (descobrir novos matches)'
        required: false
        default: ''

permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
      NODE_OPTIONS: '--max-old-space-size=4096'
      # Medido a 2026-09-24: sem isto, cada integracao gasta 4m40s a
      # regenerar a curadoria da homepage (build-homepage-data) -- trabalho
      # identico em todas as lojas, feito 219x por dia. Com a variavel, a
      # integracao passa de ~5min para ~10s, e o re-integrate do
      # resilient-push deixa de custar 5 minutos por tentativa rejeitada.
      # A homepage e' regenerada uma vez por dia no recommendations.yml.
      COSMATH_SKIP_HP: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # O catalogo vive comprimido no git (13 MB em vez de 100 MB): o
      # .json passava o limite de 100 MB do GitHub e as lojas grandes viam
      # o push recusado com GH001. Ver scripts/ci/seed.sh.
      - name: Descomprimir o catalogo
        run: bash scripts/ci/seed.sh unpack

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install deps
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Testes offline (EAN e leitura completa garantida)
        run: node scripts/test-continente.cjs

      - name: Scrape Continente Online
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            node scripts/scrape-continente-catalog.js --full --limit=30
          elif [ -n "${{ github.event.inputs.limit }}" ]; then
            node scripts/scrape-continente-catalog.js --limit=${{ github.event.inputs.limit }}
          elif [ "${{ github.event.schedule }}" = "0 4 * * 1" ] || [ -n "${{ github.event.inputs.full }}" ]; then
            node scripts/scrape-continente-catalog.js --full --resume
          else
            node scripts/scrape-continente-catalog.js
          fi

      - name: Upload scrape artifact (safety-net)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: continente-catalog-${{ github.run_id }}
          path: data/catalog/continente-full.json
          retention-days: 14

      # o ensaio do PR não publica
      - name: Integrate into seed
        if: github.event_name != 'pull_request'
        run: node scripts/integrate-continente-catalog.js

      - name: Commit changes
        if: github.event_name != 'pull_request'
        env:
          GIT_AUTHOR_NAME: CosMath Bot
          GIT_AUTHOR_EMAIL: bot@cosmath.pt
          GIT_COMMITTER_NAME: CosMath Bot
          GIT_COMMITTER_EMAIL: bot@cosmath.pt
        run: |
          set -e
          # O .json é ignorado pelo git — só o .gz é rastreado. Um `git diff`
          # do .json diria SEMPRE "sem alterações", e loja nenhuma publicava nada.
          # Comprimir PRIMEIRO e testar o .gz, que é byte-a-byte determinístico
          # graças ao `gzip -n` (sem -n, o cabeçalho leva a data e o teste dava
          # sempre alteração — 13,4 MB de commit por dia e por loja, sem dados novos).
          bash scripts/ci/seed.sh pack
          if git diff --quiet -- data/seed-bundle.json.gz demo.html; then
            echo "Nenhuma alteração — nada a fazer."
            exit 0
          fi
          git add data/seed-bundle.json.gz demo.html
          git add -f data/catalog/continente-full.json 2>/dev/null || true
          DATE=$(date -u +%Y-%m-%d)
          git commit -m "chore: Continente Online daily refresh ($DATE)" \
            -m "Auto-update via GitHub Actions. Sem mexer noutras lojas."

      - name: Push to main (resilient — re-integra sobre origin em conflito)
        if: github.event_name != 'pull_request'
        run: |
          set -e
          bash scripts/ci/resilient-push.sh \
            "node scripts/integrate-continente-catalog.js" \
            "chore: Continente Online daily refresh ($(date -u +%Y-%m-%d))" \
            data/catalog/continente-full.json
