name: Deploy branch sync (Vercel)

# O Vercel observa o branch `deploy` (não o main): os ~140 pushes/dia dos bots
# esgotavam o limite de ~100 deploys/dia do plano free. Este workflow aponta
# `deploy` para o tip do main:
#   - a seguir a CADA db-sync (gatilho principal — ver o bloco `on:`)
#   - 4×/dia por cron, só como rede de segurança
#   - imediatamente após pushes MANUAIS (commit que NÃO começa por "chore:" —
#     os bots dos refreshes usam sempre "chore: <Loja> daily refresh")
#   - à mão via workflow_dispatch
# O update é feito via API (PATCH da ref, só fast-forward) — não descarrega os HTMLs de 60MB.

on:
  # O GATILHO PRINCIPAL e' o fim do db-sync, nao o relogio. Razao medida a
  # 2026-09-25: o GitHub despriorizou os agendamentos deste repo (217 crons) e
  # atrasa-os HORAS, de forma consistente:
  #
  #     db-sync         atraso mediano 275 min (4,6h), pior 406 min
  #     deploy-branch   atraso mediano 113 min (1,9h), pior 173 min
  #     lojas           2,5 a 5,5 h (unifarma, hiperfarma, atcosmetics)
  #
  # O ESPACAMENTO sobrevive (as lojas a 8h continuam a ~8h de intervalo), por
  # isso a latencia melhora ao acrescentar janelas. O que NAO sobrevive e'
  # qualquer tentativa de alinhar dois workflows pelo relogio: com 4,6h contra
  # 1,9h de atraso, um desfasamento de 30 min nao existe -- nem a ordem se
  # mantem. A primeira versao desta alteracao tentou isso e estava errada.
  #
  # PORQUE IMPORTA: o preco "desde X" no cartao vem do indice (gerado no build)
  # e o painel de comparacao vem da BD (gerada no db-sync). Se o build correr
  # sobre um seed diferente daquele que foi para a BD, o cartao anuncia um preco
  # que o painel nao confirma -- num site de comparacao de precos isso e' o pior
  # defeito possivel.
  #
  # Encadear resolve por construcao, e e' imune ao atraso: o build corre quando
  # o sync ACABA, e aponta a branch ao MESMO commit que o sync usou
  # (workflow_run.head_sha). Os dois passam a ver exactamente o mesmo seed.
  workflow_run:
    workflows: ['DB sync (Fase 1)']
    types: [completed]

  schedule:
    # Rede de seguranca, nao o caminho normal: de 6 em 6 horas, para o site
    # continuar a reconstruir se o db-sync deixar de correr. So' 4x/dia porque
    # estas sao as janelas que podem sair incoerentes com a BD.
    - cron: '20 1,7,13,19 * * *'

  push:
    branches: [main]

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-branch-sync
  cancel-in-progress: true

jobs:
  sync:
    # Duas guardas:
    #  - push de bot ("chore:") nao deploya (sao ~200/dia; esgotavam o limite
    #    da Vercel). Espera pelo proximo db-sync ou pelo cron de rede.
    #  - no gatilho workflow_run exige-se que o db-sync tenha tido SUCESSO. O
    #    `types: [completed]` dispara tambem em falha e em cancelamento, e ai
    #    a BD nao foi actualizada (ou ficou a meio: o push-catalog-to-db faz
    #    upserts e so' depois as limpezas). Construir o indice nesse caso
    #    poe o cartao a' frente do painel, que e' a incoerencia que este
    #    encadeamento existe para evitar. Se o sync falhar em serie, o cron
    #    de 6/6h continua a reconstruir o site.
    if: >-
      (github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'chore:'))
      && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Apontar deploy → main (via API, sem checkout)
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_SYNC_SHA: ${{ github.event.workflow_run.head_sha }}
          DEPLOY_EVENT: ${{ github.event_name }}
          DEPLOY_REPO: ${{ github.repository }}
        run: |
          #!/usr/bin/env bash
          # Avança deploy sem nunca recuar o branch. No workflow_run preserva o SHA do
          # db-sync; nos outros gatilhos lê o main atual para não usar um evento antigo.
          set -euo pipefail
          
          : "${DEPLOY_REPO:?DEPLOY_REPO em falta}"
          : "${DEPLOY_EVENT:?DEPLOY_EVENT em falta}"
          repo="repos/${DEPLOY_REPO}"
          
          for attempt in 1 2 3 4 5; do
            if [ "$DEPLOY_EVENT" = workflow_run ]; then
              target="${DEPLOY_SYNC_SHA:?DEPLOY_SYNC_SHA em falta}"
            else
              target="$(gh api "$repo/git/refs/heads/main" --jq '.object.sha')"
            fi
            [[ "$target" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "SHA alvo inválido: $target" >&2; exit 1; }
          
            if ! current="$(gh api "$repo/git/refs/heads/deploy" --jq '.object.sha' 2>/dev/null)"; then
              if gh api "$repo/git/refs" -X POST -f ref=refs/heads/deploy -f sha="$target"; then
                echo "deploy criado em $target"
                exit 0
              fi
              echo 'Não foi possível criar deploy; reler a ref após possível corrida.' >&2
              continue
            fi
            if [ "$current" = "$target" ]; then
              echo "deploy já está em $target"
              exit 0
            fi
          
            # compare BASE...HEAD: ahead significa que target descende de current.
            relation="$(gh api "$repo/compare/${current}...${target}" --jq '.status')"
            case "$relation" in
              behind)
                echo "Sincronização antiga ignorada: deploy=$current, alvo=$target"
                exit 0 ;;
              identical)
                echo "deploy já está em $target"
                exit 0 ;;
              ahead)
                # A API recusa um recuo mesmo se outra corrida mexer na ref entretanto.
                if gh api "$repo/git/refs/heads/deploy" -X PATCH -f sha="$target" -F force=false; then
                  echo "deploy avançou para $target"
                  exit 0
                fi
                echo "deploy mudou durante a atualização; nova leitura ($attempt/5)." >&2 ;;
              *)
                echo "Histórico divergente entre deploy=$current e alvo=$target ($relation); intervenção necessária." >&2
                exit 1 ;;
            esac
          done
          
          echo 'Não foi possível avançar deploy após 5 tentativas.' >&2
          exit 1
