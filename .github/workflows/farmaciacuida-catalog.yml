# CosMath — Farmácia Cuida · refresh 2x/dia, só ofertas em produtos existentes
# ============================================================
# Shopify, farmácia portuguesa (farmaciacuida.com). Preços e stock em bloco (/products.json), GTIN em cache
# (data/catalog/farmaciacuida-gtin.json), integração sem criar produtos
# (scripts/lib/integrar-existentes.js). Preparada a 2026-10-09, mesmo modelo das lojas do #43 (SkinLovers e Ilha).

name: Farmácia Cuida daily refresh

on:
  schedule:
    - cron: '23 6,18 * * *'
  workflow_dispatch:
    inputs:
      limite:
        description: 'Limite de produtos (vazio = todos) — ensaio que não publica'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: farmaciacuida-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
      NODE_OPTIONS: '--max-old-space-size=4096'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Descomprimir o catalogo
        run: bash scripts/ci/seed.sh unpack
      - name: Testes offline (recolha e integração só-existentes)
        run: node scripts/test-integrar-existentes.js
      - name: Recolher Farmácia Cuida
        env:
          LIMITE: ${{ github.event.inputs.limite }}
        run: |
          if [ -n "$LIMITE" ]; then
            node scripts/scrape-farmaciacuida-catalog.js --limite="$LIMITE"
          else
            node scripts/scrape-farmaciacuida-catalog.js
          fi
      - name: Guardar a recolha (artefacto)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: farmaciacuida-${{ github.run_id }}
          path: |
            data/catalog/farmaciacuida-full.json
            data/catalog/farmaciacuida-gtin.json
          retention-days: 14
      # Um ensaio com limite NÃO publica (e o integrador recusa feeds parciais).
      - name: Validar e integrar em produtos existentes
        if: github.event.inputs.limite == ''
        run: |
          node scripts/integrate-farmaciacuida-catalog.js --dry-run
          node scripts/integrate-farmaciacuida-catalog.js
      - name: Commit
        if: github.event.inputs.limite == ''
        env:
          GIT_AUTHOR_NAME: CosMath Bot
          GIT_AUTHOR_EMAIL: bot@cosmath.pt
          GIT_COMMITTER_NAME: CosMath Bot
          GIT_COMMITTER_EMAIL: bot@cosmath.pt
        run: |
          set -euo pipefail
          bash scripts/ci/seed.sh pack
          git add data/seed-bundle.json.gz data/catalog/farmaciacuida-gtin.json
          git add -f data/catalog/farmaciacuida-full.json
          if git diff --cached --quiet; then echo "Nenhuma alteração."; exit 0; fi
          git commit -m "chore: Farmácia Cuida daily refresh ($(date -u +%Y-%m-%d))"
      - name: Push (resiliente — re-integra sobre origin em conflito)
        if: github.event.inputs.limite == ''
        env:
          GIT_AUTHOR_NAME: CosMath Bot
          GIT_AUTHOR_EMAIL: bot@cosmath.pt
          GIT_COMMITTER_NAME: CosMath Bot
          GIT_COMMITTER_EMAIL: bot@cosmath.pt
        run: |
          set -euo pipefail
          if [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" ]; then echo "Nada para publicar."; exit 0; fi
          bash scripts/ci/resilient-push.sh \
            "node scripts/integrate-farmaciacuida-catalog.js" \
            "chore: Farmácia Cuida daily refresh ($(date -u +%Y-%m-%d))" \
            data/catalog/farmaciacuida-full.json data/catalog/farmaciacuida-gtin.json
