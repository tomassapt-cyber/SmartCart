# CosMath — Farmácia da Liga (loja 94) · refresh 3x/dia
# ============================================================
# Farmácia de Gaia. Lê o FEED do KuantoKusta (/feed/kk-liga): o catálogo todo
# (~6.400 produtos, EAN + CNP + preço + stock) num único XML de ~1 MB, gerado
# na hora (~35 s). Um pedido por corrida — por isso 3x/dia.
# Entrou a 2026-10-01: 1,08x a mediana, a mais barata em 7% dos comuns, 36% de
# EAN novos (medido com o feed inteiro).

name: Farmacia da Liga daily refresh

on:
  schedule:
    # 3x/dia (um pedido só, ver o cabeçalho). Os crons deste repo atrasam horas
    # (ver deploy-branch.yml) — o que conta é o espaçamento, não a hora.
    - cron: '50 6 * * *'
    - cron: '50 14 * * *'
    - cron: '50 22 * * *'
  workflow_dispatch:
    inputs:
      limite:
        description: 'Qualquer valor = só testa a leitura do feed, não publica'
        required: false
        default: ''

permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
      NODE_OPTIONS: '--max-old-space-size=4096'
      # sem isto cada integração gasta ~5 min a regenerar a homepage (ver
      # caretobeauty-catalog.yml); a homepage é refeita 1x/dia noutro workflow
      COSMATH_SKIP_HP: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Descomprimir o catalogo
        run: bash scripts/ci/seed.sh unpack

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install deps
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Scrape Farmacia da Liga
        run: |
          node scripts/scrape-farmaciadaliga-catalog.js

      - name: Upload scrape artifact (safety-net)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: farmaciadaliga-catalog-${{ github.run_id }}
          path: data/catalog/farmaciadaliga-full.json
          retention-days: 14

      # Um teste com limite NÃO publica: ~40 produtos no seed apagariam as
      # ofertas das outras até à corrida seguinte.
      - name: Integrate into seed
        if: github.event.inputs.limite == ''
        run: node scripts/integrate-farmaciadaliga-catalog.js

      - name: Commit changes
        if: github.event.inputs.limite == ''
        env:
          GIT_AUTHOR_NAME: CosMath Bot
          GIT_AUTHOR_EMAIL: bot@cosmath.pt
          GIT_COMMITTER_NAME: CosMath Bot
          GIT_COMMITTER_EMAIL: bot@cosmath.pt
        run: |
          set -e
          # Comprimir PRIMEIRO e testar o .gz: o .json está no .gitignore (ver
          # scripts/ci/seed.sh e caretobeauty-catalog.yml).
          bash scripts/ci/seed.sh pack
          if git diff --quiet -- data/seed-bundle.json.gz demo.html; then
            echo "Nenhuma alteração — nada a fazer."
            exit 0
          fi
          git add data/seed-bundle.json.gz demo.html
          git add -f data/catalog/farmaciadaliga-full.json 2>/dev/null || true
          git commit -m "chore: Farmacia da Liga daily refresh ($(date -u +%Y-%m-%d))" \
            -m "Auto-update via GitHub Actions. Sem mexer noutras lojas."

      - name: Push to main (resilient — re-integra sobre origin em conflito)
        if: github.event.inputs.limite == ''
        run: |
          set -e
          bash scripts/ci/resilient-push.sh \
            "node scripts/integrate-farmaciadaliga-catalog.js" \
            "chore: Farmacia da Liga daily refresh ($(date -u +%Y-%m-%d))" \
            data/catalog/farmaciadaliga-full.json
