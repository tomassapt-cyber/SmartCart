# CosMath — Farmácia Gaia Jardim (loja 90) · refresh 2x/dia
# ============================================================
# Shopify (scripts/lib/shopify-loja.js) + integração partilhada
# (scripts/lib/integrar-farmacia.js). Entrou a 2026-10-01.
# farmácia de Gaia (Shopify), ~7.500 produtos; CNP no sku em ~99% e EAN no barcode em ~2/3. 0,98× a mediana (amostra de 101 com EAN, 55 em comum), 46% de EAN novos.

name: Farmacia Gaia Jardim daily refresh

on:
  schedule:
    # 2x/dia (catálogo de ~7.500 fichas, ~1 h cada). Os crons deste repo atrasam horas
    # (ver deploy-branch.yml) — o que conta é o espaçamento, não a hora.
    - cron: '5 4 * * *'
    - cron: '5 16 * * *'
  workflow_dispatch:
    inputs:
      limite:
        description: 'Limite de produtos (vazio = todos) — para testar'
        required: false
        default: ''

permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
      NODE_OPTIONS: '--max-old-space-size=4096'
      # sem isto cada integração gasta ~5 min a regenerar a homepage (ver
      # caretobeauty-catalog.yml); a homepage é refeita 1x/dia noutro workflow
      COSMATH_SKIP_HP: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Descomprimir o catalogo
        run: bash scripts/ci/seed.sh unpack

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install deps
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Scrape Farmacia Gaia Jardim
        run: |
          if [ -n "${{ github.event.inputs.limite }}" ]; then
            node scripts/scrape-farmaciagaiajardim-catalog.js --limite=${{ github.event.inputs.limite }}
          else
            node scripts/scrape-farmaciagaiajardim-catalog.js
          fi

      - name: Upload scrape artifact (safety-net)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: farmaciagaiajardim-catalog-${{ github.run_id }}
          path: data/catalog/farmaciagaiajardim-full.json
          retention-days: 14

      # Um teste com limite NÃO publica: ~40 produtos no seed apagariam as
      # ofertas das outras ~800 até à corrida seguinte.
      - name: Integrate into seed
        if: github.event.inputs.limite == ''
        run: node scripts/integrate-farmaciagaiajardim-catalog.js

      - name: Commit changes
        if: github.event.inputs.limite == ''
        env:
          GIT_AUTHOR_NAME: CosMath Bot
          GIT_AUTHOR_EMAIL: bot@cosmath.pt
          GIT_COMMITTER_NAME: CosMath Bot
          GIT_COMMITTER_EMAIL: bot@cosmath.pt
        run: |
          set -e
          # Comprimir PRIMEIRO e testar o .gz: o .json está no .gitignore (ver
          # scripts/ci/seed.sh e caretobeauty-catalog.yml).
          bash scripts/ci/seed.sh pack
          if git diff --quiet -- data/seed-bundle.json.gz demo.html; then
            echo "Nenhuma alteração — nada a fazer."
            exit 0
          fi
          git add data/seed-bundle.json.gz demo.html
          git add -f data/catalog/farmaciagaiajardim-full.json 2>/dev/null || true
          git commit -m "chore: Farmacia Gaia Jardim daily refresh ($(date -u +%Y-%m-%d))" \
            -m "Auto-update via GitHub Actions. Sem mexer noutras lojas."

      - name: Push to main (resilient — re-integra sobre origin em conflito)
        if: github.event.inputs.limite == ''
        run: |
          set -e
          bash scripts/ci/resilient-push.sh \
            "node scripts/integrate-farmaciagaiajardim-catalog.js" \
            "chore: Farmacia Gaia Jardim daily refresh ($(date -u +%Y-%m-%d))" \
            data/catalog/farmaciagaiajardim-full.json
