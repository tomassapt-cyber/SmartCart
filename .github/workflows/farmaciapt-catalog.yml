# GirlMath — Farmácia.pt daily price refresh
# ============================================================
# Farmácia.pt é Magento. Scraper usa HTTP simples (fetch) + parse JSON-LD
# do HTML — sem Playwright. ~10k URLs beauty (de 32k totais) × 600ms = ~25 min
# com concurrency=4. Suporta --chunk=N/M para dividir em runs paralelos.
#
# Pipeline:
#   1. scrape-farmaciapt-catalog.js  → data/catalog/farmaciapt-full.json
#   2. integrate-farmaciapt-catalog.js → match por EAN-real (GTIN-13) + fingerprint
#   3. inject-seed-into-demo.js → regenera demo.html / index.html / catalogo.html


name: Farmácia.pt daily refresh

on:
  schedule:
    # 15h UTC — depois de Wells (14h), antes do ciclo recomeçar
    - cron: '0 17 * * *'
    - cron: '0 1 * * *'   # 3x/dia (regra do user 2026-07-03)
    - cron: '0 9 * * *'   # 3x/dia
  workflow_dispatch:
    inputs:
      limit:
        description: 'Limit (vazio = sem limite, útil para teste)'
        required: false
        default: ''

permissions:
  contents: write   # precisamos de fazer push do seed + HTML actualizados
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
      # Medido a 2026-09-24: sem isto, cada integracao gasta 4m40s a
      # regenerar a curadoria da homepage (build-homepage-data) -- trabalho
      # identico em todas as lojas, feito 219x por dia. Com a variavel, a
      # integracao passa de ~5min para ~10s, e o re-integrate do
      # resilient-push deixa de custar 5 minutos por tentativa rejeitada.
      # A homepage e' regenerada uma vez por dia no recommendations.yml.
      COSMATH_SKIP_HP: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # O catalogo vive comprimido no git (13 MB em vez de 100 MB): o
      # .json passava o limite de 100 MB do GitHub e as lojas grandes viam
      # o push recusado com GH001. Ver scripts/ci/seed.sh.
      - name: Descomprimir o catalogo
        run: bash scripts/ci/seed.sh unpack

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install deps
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Scrape Farmácia.pt catalog
        run: |
          if [ -n "${{ github.event.inputs.limit }}" ]; then
            node scripts/scrape-farmaciapt-catalog.js --limit=${{ github.event.inputs.limit }}
          else
            node scripts/scrape-farmaciapt-catalog.js
          fi

      - name: Upload scrape artifact (safety-net)
        # Garante que mesmo se o integrate falhar / push der conflict,
        # temos os dados scraped guardados como artifact descarregável.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: farmaciapt-catalog-${{ github.run_id }}
          path: data/catalog/farmaciapt-full.json
          retention-days: 14

      - name: Integrate into seed
        run: node scripts/integrate-farmaciapt-catalog.js

      - name: Commit changes
        env:
          GIT_AUTHOR_NAME: GirlMath Bot
          GIT_AUTHOR_EMAIL: bot@girlmath.pt
          GIT_COMMITTER_NAME: GirlMath Bot
          GIT_COMMITTER_EMAIL: bot@girlmath.pt
        run: |
          set -e
          # O .json é ignorado pelo git — só o .gz é rastreado. Um `git diff`
          # do .json diria SEMPRE "sem alterações", e loja nenhuma publicava nada.
          # Comprimir PRIMEIRO e testar o .gz, que é byte-a-byte determinístico
          # graças ao `gzip -n` (sem -n, o cabeçalho leva a data e o teste dava
          # sempre alteração — 13,4 MB de commit por dia e por loja, sem dados novos).
          bash scripts/ci/seed.sh pack
          if git diff --quiet -- data/seed-bundle.json.gz demo.html; then
            echo "Nenhuma alteração — nada a fazer."
            exit 0
          fi
          # -f para forçar o farmaciapt-full.json que está gitignored
          git add data/seed-bundle.json.gz demo.html
          git add -f data/catalog/farmaciapt-full.json 2>/dev/null || true
          DATE=$(date -u +%Y-%m-%d)
          git commit -m "chore: Farmácia.pt daily refresh ($DATE)" \
            -m "Auto-update via GitHub Actions. Sem mexer noutras lojas."

      - name: Push to main (resilient — re-integra sobre origin em conflito)
        run: |
          set -e
          bash scripts/ci/resilient-push.sh \
            "node scripts/integrate-farmaciapt-catalog.js" \
            "chore: Farmácia.pt daily refresh ($(date -u +%Y-%m-%d))" \
            data/catalog/farmaciapt-full.json
