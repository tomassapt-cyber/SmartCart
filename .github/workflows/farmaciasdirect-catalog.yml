# CosMath — Farmaciasdirect (loja 87) · refresh 3x/dia
# ============================================================
# Farmácia espanhola com loja .pt. Shopify headless: lê-se pela loja-base
# farmaciasdirectprod.myshopify.com, /collections/<c>/products.json (250 por
# pedido, ~160 pedidos com pausa de 1,5 s — a loja dá 429 a quem pede depressa).
# EAN tirado do sku ("VO" + EAN). Ver scripts/scrape-farmaciasdirect-catalog.js.
# Entrou a 2026-10-01: 0,95x a mediana, 82% de EAN novos.

name: Farmaciasdirect daily refresh

on:
  schedule:
    # 3x/dia, a cadência-padrão do projeto. Os crons deste repo atrasam horas
    # (ver deploy-branch.yml) — o que conta é o espaçamento, não a hora.
    - cron: '5 6 * * *'
    - cron: '5 14 * * *'
    - cron: '5 22 * * *'
  workflow_dispatch:
    inputs:
      limite:
        description: 'Máximo de páginas por coleção (vazio = todas) — para testar'
        required: false
        default: ''

permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
      NODE_OPTIONS: '--max-old-space-size=4096'
      # sem isto cada integração gasta ~5 min a regenerar a homepage (ver
      # caretobeauty-catalog.yml); a homepage é refeita 1x/dia noutro workflow
      COSMATH_SKIP_HP: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Descomprimir o catalogo
        run: bash scripts/ci/seed.sh unpack

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install deps
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Scrape Farmaciasdirect
        run: |
          if [ -n "${{ github.event.inputs.limite }}" ]; then
            node scripts/scrape-farmaciasdirect-catalog.js --max-paginas=${{ github.event.inputs.limite }}
          else
            node scripts/scrape-farmaciasdirect-catalog.js
          fi

      - name: Upload scrape artifact (safety-net)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: farmaciasdirect-catalog-${{ github.run_id }}
          path: data/catalog/farmaciasdirect-full.json
          retention-days: 14

      # Um teste com limite NÃO publica: ~40 produtos no seed apagariam as
      # ofertas das outras ~800 até à corrida seguinte.
      - name: Integrate into seed
        if: github.event.inputs.limite == ''
        run: node scripts/integrate-farmaciasdirect-catalog.js

      - name: Commit changes
        if: github.event.inputs.limite == ''
        env:
          GIT_AUTHOR_NAME: CosMath Bot
          GIT_AUTHOR_EMAIL: bot@cosmath.pt
          GIT_COMMITTER_NAME: CosMath Bot
          GIT_COMMITTER_EMAIL: bot@cosmath.pt
        run: |
          set -e
          # Comprimir PRIMEIRO e testar o .gz: o .json está no .gitignore (ver
          # scripts/ci/seed.sh e caretobeauty-catalog.yml).
          bash scripts/ci/seed.sh pack
          if git diff --quiet -- data/seed-bundle.json.gz demo.html; then
            echo "Nenhuma alteração — nada a fazer."
            exit 0
          fi
          git add data/seed-bundle.json.gz demo.html
          git add -f data/catalog/farmaciasdirect-full.json 2>/dev/null || true
          git commit -m "chore: Farmaciasdirect daily refresh ($(date -u +%Y-%m-%d))" \
            -m "Auto-update via GitHub Actions. Sem mexer noutras lojas."

      - name: Push to main (resilient — re-integra sobre origin em conflito)
        if: github.event.inputs.limite == ''
        run: |
          set -e
          bash scripts/ci/resilient-push.sh \
            "node scripts/integrate-farmaciasdirect-catalog.js" \
            "chore: Farmaciasdirect daily refresh ($(date -u +%Y-%m-%d))" \
            data/catalog/farmaciasdirect-full.json
