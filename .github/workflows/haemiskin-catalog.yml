# GirlMath — HaemiSkin daily price refresh
# ============================================================
# haemiskin.pt é Shopify (boutique K-beauty). Scraper HTTP simples + JSON-LD
# (gtin13 = EAN real) — sem Playwright/ScrapingBee. ~108 produtos, ~1 min.
#
# Pipeline:
#   1. scrape-haemiskin-catalog.js  → data/catalog/haemiskin-full.json
#   2. integrate-haemiskin-catalog.js → match por EAN-real + fingerprint (v1)
#   3. inject-seed-into-demo.js (corre dentro do integrate) → regenera HTML

name: HaemiSkin daily refresh

on:
  schedule:
    # 20h UTC — depois de Loja da Farmácia (19h)
    - cron: '0 20 * * *'
    - cron: '0 4 * * *'   # 3x/dia (regra do user 2026-07-03)
    - cron: '0 12 * * *'   # 3x/dia
  workflow_dispatch:
    inputs:
      limit:
        description: 'Limit (vazio = sem limite, útil para teste)'
        required: false
        default: ''

permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install deps
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Scrape HaemiSkin catalog
        run: |
          if [ -n "${{ github.event.inputs.limit }}" ]; then
            node scripts/scrape-haemiskin-catalog.js --limit=${{ github.event.inputs.limit }}
          else
            node scripts/scrape-haemiskin-catalog.js
          fi

      - name: Upload scrape artifact (safety-net)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: haemiskin-catalog-${{ github.run_id }}
          path: data/catalog/haemiskin-full.json
          retention-days: 14

      - name: Integrate into seed
        run: node scripts/integrate-haemiskin-catalog.js

      - name: Commit changes
        env:
          GIT_AUTHOR_NAME: GirlMath Bot
          GIT_AUTHOR_EMAIL: bot@girlmath.pt
          GIT_COMMITTER_NAME: GirlMath Bot
          GIT_COMMITTER_EMAIL: bot@girlmath.pt
        run: |
          set -e
          if git diff --quiet -- data/seed-bundle.json demo.html index.html catalogo.html; then
            echo "Nenhuma alteração — nada a fazer."
            exit 0
          fi
          git add data/seed-bundle.json demo.html index.html catalogo.html
          git add -f data/catalog/haemiskin-full.json 2>/dev/null || true
          DATE=$(date -u +%Y-%m-%d)
          git commit -m "chore: HaemiSkin daily refresh ($DATE)" \
            -m "Auto-update via GitHub Actions. Sem mexer noutras lojas."

      - name: Push to main (resilient — re-integra sobre origin em conflito)
        run: |
          set -e
          bash scripts/ci/resilient-push.sh \
            "node scripts/integrate-haemiskin-catalog.js" \
            "chore: HaemiSkin daily refresh ($(date -u +%Y-%m-%d))" \
            data/catalog/haemiskin-full.json
