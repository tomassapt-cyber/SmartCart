# CosMath — Korean Skincare (koreanskincare.pt) · só ofertas em produtos existentes
# ============================================================
# Shopify (~3 900 fichas). O /products.json responde 429 ao nosso robô: cada produto lê-se
# no seu .js, a 2 s, em ROTAÇÃO com memória (.cache-lojas/koreanskincare-memoria.json) —
# ver scripts/scrape-koreanskincare-catalog.js. Ronda 11 de lojas (25/11/2026).
# 2×/dia com orçamento de 100 min: as fichas com produtos nossos leem-se todos os dias.

name: Korean Skincare refresh

on:
  schedule:
    - cron: '20 5 * * *'
    - cron: '20 17 * * *'   # 2×/dia
  # ensaio na nuvem no próprio PR (30 fichas, sem publicar): mostra se os servidores do GitHub têm acesso
  pull_request:
    paths:
      - 'scripts/scrape-koreanskincare-catalog.js'
      - 'scripts/integrate-koreanskincare-catalog.js'
      - '.github/workflows/koreanskincare-catalog.yml'
  workflow_dispatch:
    inputs:
      limite:
        description: 'Limite de fichas (vazio = rotação normal) — ensaio que não publica'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: koreanskincare-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 150   # orçamento de leitura de 100 min + integrar e gravar
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
      NODE_OPTIONS: '--max-old-space-size=4096'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Descomprimir o catalogo
        run: bash scripts/ci/seed.sh unpack
      - name: Testes offline (leitura, rotação, integração só-existentes e UA honesto)
        run: node scripts/test-koreanskincare.cjs && node scripts/test-integrar-existentes.js && node scripts/test-ua-honesto.cjs
      - name: Repor a memória da rotação
        uses: actions/cache/restore@v4
        with:
          path: .cache-lojas/koreanskincare-memoria.json
          key: koreanskincare-memoria-${{ github.run_id }}
          restore-keys: koreanskincare-memoria-
      - name: Recolher Korean Skincare
        env:
          LIMITE: ${{ github.event_name == 'pull_request' && '30' || github.event.inputs.limite }}
        run: |
          if [ -n "$LIMITE" ]; then
            node scripts/scrape-koreanskincare-catalog.js --limite="$LIMITE"
          else
            node scripts/scrape-koreanskincare-catalog.js --orcamento-min=100
          fi
      # a memória guarda-se mesmo que a recolha pare a meio (o que já se leu vale); o ensaio do PR não a guarda
      - name: Guardar a memória da rotação
        if: always() && github.event_name != 'pull_request' && github.event.inputs.limite == '' && hashFiles('.cache-lojas/koreanskincare-memoria.json') != ''
        uses: actions/cache/save@v4
        with:
          path: .cache-lojas/koreanskincare-memoria.json
          key: koreanskincare-memoria-${{ github.run_id }}
      - name: Guardar a recolha (artefacto)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: koreanskincare-${{ github.run_id }}
          path: data/catalog/koreanskincare-full.json
          retention-days: 14
      # Um ensaio com limite NÃO publica (e o integrador recusa feeds parciais).
      - name: Validar e integrar em produtos existentes
        if: github.event_name != 'pull_request' && github.event.inputs.limite == ''
        run: |
          node scripts/integrate-koreanskincare-catalog.js --dry-run
          node scripts/integrate-koreanskincare-catalog.js
      - name: Commit
        if: github.event_name != 'pull_request' && github.event.inputs.limite == ''
        env:
          GIT_AUTHOR_NAME: CosMath Bot
          GIT_AUTHOR_EMAIL: bot@cosmath.pt
          GIT_COMMITTER_NAME: CosMath Bot
          GIT_COMMITTER_EMAIL: bot@cosmath.pt
        run: |
          set -euo pipefail
          bash scripts/ci/seed.sh pack
          git add data/seed-bundle.json.gz
          git add -f data/catalog/koreanskincare-full.json
          if git diff --cached --quiet; then echo "Nenhuma alteração."; exit 0; fi
          git commit -m "chore: Korean Skincare refresh ($(date -u +%Y-%m-%d))"
      - name: Push (resiliente — re-integra sobre origin em conflito)
        if: github.event_name != 'pull_request' && github.event.inputs.limite == ''
        env:
          GIT_AUTHOR_NAME: CosMath Bot
          GIT_AUTHOR_EMAIL: bot@cosmath.pt
          GIT_COMMITTER_NAME: CosMath Bot
          GIT_COMMITTER_EMAIL: bot@cosmath.pt
        run: |
          set -euo pipefail
          if [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" ]; then echo "Nada para publicar."; exit 0; fi
          bash scripts/ci/resilient-push.sh \
            "node scripts/integrate-koreanskincare-catalog.js" \
            "chore: Korean Skincare refresh ($(date -u +%Y-%m-%d))" \
            data/catalog/koreanskincare-full.json
