# GirlMath — Loja da Farmácia daily price refresh
# ============================================================
# lojadafarmacia.com é Magento. Scraper usa HTTP simples (fetch) + parse
# JSON-LD (gtin13 = EAN real, preço, availability) — sem Playwright/ScrapingBee.
# ~11k URLs /artigo/ × ~250ms com concurrency=6 ≈ 45 min.
#
# Pipeline:
#   1. scrape-lojafarmacia-catalog.js  → data/catalog/lojafarmacia-full.json
#   2. integrate-lojafarmacia-catalog.js → match por EAN-real + fingerprint
#      (v1: só enriquece produtos existentes; NÃO cria SKUs novos)
#   3. inject-seed-into-demo.js (corre dentro do integrate) → regenera HTML

name: Loja da Farmácia daily refresh

on:
  schedule:
    # 19h UTC — depois de A Farmácia Online (18h)
    - cron: '0 19 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Limit (vazio = sem limite, útil para teste)'
        required: false
        default: ''

permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
      NODE_OPTIONS: '--max-old-space-size=4096'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install deps
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Scrape Loja da Farmácia catalog
        run: |
          if [ -n "${{ github.event.inputs.limit }}" ]; then
            node scripts/scrape-lojafarmacia-catalog.js --limit=${{ github.event.inputs.limit }} --concurrency=5 --delay=300
          else
            node scripts/scrape-lojafarmacia-catalog.js --concurrency=5 --delay=300
          fi

      - name: Upload scrape artifact (safety-net)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lojafarmacia-catalog-${{ github.run_id }}
          path: data/catalog/lojafarmacia-full.json
          retention-days: 14

      - name: Integrate into seed
        run: node scripts/integrate-lojafarmacia-catalog.js

      - name: Commit changes
        env:
          GIT_AUTHOR_NAME: GirlMath Bot
          GIT_AUTHOR_EMAIL: bot@girlmath.pt
          GIT_COMMITTER_NAME: GirlMath Bot
          GIT_COMMITTER_EMAIL: bot@girlmath.pt
        run: |
          set -e
          if git diff --quiet -- data/seed-bundle.json demo.html index.html catalogo.html; then
            echo "Nenhuma alteração — nada a fazer."
            exit 0
          fi
          git add data/seed-bundle.json demo.html index.html catalogo.html
          git add -f data/catalog/lojafarmacia-full.json 2>/dev/null || true
          DATE=$(date -u +%Y-%m-%d)
          git commit -m "chore: Loja da Farmácia daily refresh ($DATE)" \
            -m "Auto-update via GitHub Actions. Sem mexer noutras lojas."

      - name: Push to main (resilient — re-integra sobre origin em conflito)
        run: |
          set -e
          bash scripts/ci/resilient-push.sh \
            "node scripts/integrate-lojafarmacia-catalog.js" \
            "chore: Loja da Farmácia daily refresh ($(date -u +%Y-%m-%d))" \
            data/catalog/lojafarmacia-full.json
