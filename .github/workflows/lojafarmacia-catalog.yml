# GirlMath — Loja da Farmácia daily price refresh
# ============================================================
# lojadafarmacia.com é Magento. Scraper usa HTTP simples (fetch) + parse
# JSON-LD (gtin13 = EAN real, preço, availability) — sem Playwright/ScrapingBee.
# ~11k URLs /artigo/. Desde 11/2026 a loja responde a ~1 ficha/s (~3 h para o
# mapa inteiro): lê-se em rotação com orçamento de 120 min — primeiro o que
# está há mais tempo sem ser lido — e o resto fica para a corrida seguinte.
#
# Pipeline:
#   1. scrape-lojafarmacia-catalog.js  → data/catalog/lojafarmacia-full.json
#   2. integrate-lojafarmacia-catalog.js → match por EAN-real + fingerprint
#      (v1: só enriquece produtos existentes; NÃO cria SKUs novos)
#   3. inject-seed-into-demo.js (corre dentro do integrate) → regenera HTML

name: Loja da Farmácia daily refresh

on:
  schedule:
    # 19h UTC — depois de A Farmácia Online (18h)
    - cron: '0 19 * * *'
    - cron: '0 3 * * *'   # 3x/dia (regra do user 2026-07-03)
    - cron: '0 11 * * *'   # 3x/dia
  # ensaio na nuvem no próprio PR (2 min de leitura, sem publicar)
  pull_request:
    paths:
      - 'scripts/scrape-lojafarmacia-catalog.js'
      - 'scripts/lib/rotacao-leitura.js'
      - '.github/workflows/lojafarmacia-catalog.yml'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Limit (vazio = sem limite, útil para teste)'
        required: false
        default: ''

permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-24.04   # 24/11: o Playwright ainda não tem Chromium para o Ubuntu 26.04 (ubuntu-latest desde 16/11)
    timeout-minutes: 150
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
      NODE_OPTIONS: '--max-old-space-size=4096'
      # Medido a 2026-09-24: sem isto, cada integracao gasta 4m40s a
      # regenerar a curadoria da homepage (build-homepage-data) -- trabalho
      # identico em todas as lojas, feito 219x por dia. Com a variavel, a
      # integracao passa de ~5min para ~10s, e o re-integrate do
      # resilient-push deixa de custar 5 minutos por tentativa rejeitada.
      # A homepage e' regenerada uma vez por dia no recommendations.yml.
      COSMATH_SKIP_HP: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # O catalogo vive comprimido no git (13 MB em vez de 100 MB): o
      # .json passava o limite de 100 MB do GitHub e as lojas grandes viam
      # o push recusado com GH001. Ver scripts/ci/seed.sh.
      - name: Descomprimir o catalogo
        run: bash scripts/ci/seed.sh unpack

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install deps
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Testes offline (rotação e orçamento de tempo)
        run: node scripts/test-rotacao-leitura.cjs

      - name: Memória da rotação (cache)
        uses: actions/cache/restore@v4
        with:
          path: .cache-lojas
          key: rotacao-lojafarmacia-${{ github.run_id }}
          restore-keys: rotacao-lojafarmacia-

      - name: Scrape Loja da Farmácia catalog
        run: |
          # orçamento de 120 min: sobra meia hora para integrar e gravar dentro dos 150 do job
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            node scripts/scrape-lojafarmacia-catalog.js --orcamento-min=2 --concurrency=5 --delay=300
          elif [ -n "${{ github.event.inputs.limit }}" ]; then
            node scripts/scrape-lojafarmacia-catalog.js --limit=${{ github.event.inputs.limit }} --concurrency=5 --delay=300
          else
            node scripts/scrape-lojafarmacia-catalog.js --orcamento-min=120 --concurrency=5 --delay=300
          fi

      - name: Guardar a memória da rotação
        if: always() && github.event_name != 'pull_request' && hashFiles('.cache-lojas/loja-farmacia-lidas.json') != ''
        uses: actions/cache/save@v4
        with:
          path: .cache-lojas
          key: rotacao-lojafarmacia-${{ github.run_id }}

      - name: Upload scrape artifact (safety-net)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lojafarmacia-catalog-${{ github.run_id }}
          path: data/catalog/lojafarmacia-full.json
          retention-days: 14

      # o ensaio do PR integra a seco (mostra que o ficheiro parcial integra) e não publica
      - name: Integrate into seed
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            node scripts/integrate-lojafarmacia-catalog.js --dry-run
          else
            node scripts/integrate-lojafarmacia-catalog.js
          fi

      - name: Commit changes
        if: github.event_name != 'pull_request'
        env:
          GIT_AUTHOR_NAME: GirlMath Bot
          GIT_AUTHOR_EMAIL: bot@girlmath.pt
          GIT_COMMITTER_NAME: GirlMath Bot
          GIT_COMMITTER_EMAIL: bot@girlmath.pt
        run: |
          set -e
          # O .json é ignorado pelo git — só o .gz é rastreado. Um `git diff`
          # do .json diria SEMPRE "sem alterações", e loja nenhuma publicava nada.
          # Comprimir PRIMEIRO e testar o .gz, que é byte-a-byte determinístico
          # graças ao `gzip -n` (sem -n, o cabeçalho leva a data e o teste dava
          # sempre alteração — 13,4 MB de commit por dia e por loja, sem dados novos).
          bash scripts/ci/seed.sh pack
          if git diff --quiet -- data/seed-bundle.json.gz demo.html; then
            echo "Nenhuma alteração — nada a fazer."
            exit 0
          fi
          git add data/seed-bundle.json.gz demo.html
          git add -f data/catalog/lojafarmacia-full.json 2>/dev/null || true
          DATE=$(date -u +%Y-%m-%d)
          git commit -m "chore: Loja da Farmácia daily refresh ($DATE)" \
            -m "Auto-update via GitHub Actions. Sem mexer noutras lojas."

      - name: Push to main (resilient — re-integra sobre origin em conflito)
        if: github.event_name != 'pull_request'
        run: |
          set -e
          bash scripts/ci/resilient-push.sh \
            "node scripts/integrate-lojafarmacia-catalog.js" \
            "chore: Loja da Farmácia daily refresh ($(date -u +%Y-%m-%d))" \
            data/catalog/lojafarmacia-full.json
