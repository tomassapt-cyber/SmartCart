# CosMath — Manuela Serra daily price refresh
# ============================================================
# Loja Shopify (cabelo profissional). Scraper usa /products.json (sem HTML,
# sem Playwright) — 412 produtos, ~1 min. Matching por EAN-no-SKU (GTIN-13,
# ~21%) + fingerprint (vendor+nome).
#
# Pipeline:
#   1. scrape-manuelaserra-catalog.js  → data/catalog/manuelaserra-full.json
#   2. integrate-manuelaserra-catalog.js → EAN real + fingerprint
#   3. inject-seed-into-demo.js → regenera demo/index/catalogo

name: Manuela Serra daily refresh

on:
  schedule:
    - cron: '0 6 * * *'
    - cron: '0 14 * * *'   # 3x/dia (regra do user 2026-07-03)
    - cron: '0 22 * * *'   # 3x/dia
  workflow_dispatch:
    inputs:
      limit:
        description: 'Limit (vazio = sem limite, útil para teste)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install deps
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Scrape Manuela Serra catalog
        run: |
          if [ -n "${{ github.event.inputs.limit }}" ]; then
            node scripts/scrape-manuelaserra-catalog.js --limit=${{ github.event.inputs.limit }}
          else
            node scripts/scrape-manuelaserra-catalog.js
          fi

      - name: Upload scrape artifact (safety-net)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manuelaserra-catalog-${{ github.run_id }}
          path: data/catalog/manuelaserra-full.json
          retention-days: 14

      # BUG HISTORICO (2026-06-16 a 07-02): este workflow NAO tinha os steps de
      # Integrate/Commit — ia do scrape direto ao resilient-push, que via
      # HEAD==origin, "Everything up-to-date", exit 0 -> hollow success diario
      # (raspava 407 produtos para o vazio e o verified_at congelou).
      - name: Integrate into seed
        run: node scripts/integrate-manuelaserra-catalog.js

      - name: Commit changes
        env:
          GIT_AUTHOR_NAME: CosMath Bot
          GIT_AUTHOR_EMAIL: bot@cosmath.pt
          GIT_COMMITTER_NAME: CosMath Bot
          GIT_COMMITTER_EMAIL: bot@cosmath.pt
        run: |
          set -e
          if git diff --quiet -- data/seed-bundle.json demo.html index.html catalogo.html; then
            echo "Nenhuma alteracao — nada a fazer."
            exit 0
          fi
          git add data/seed-bundle.json demo.html index.html catalogo.html
          git add -f data/catalog/manuelaserra-full.json 2>/dev/null || true
          DATE=$(date -u +%Y-%m-%d)
          git commit -m "chore: Manuela Serra daily refresh ($DATE)"             -m "Auto-update via GitHub Actions. Sem mexer noutras lojas."

      - name: Push to main (resilient — re-integra sobre origin em conflito)
        run: |
          set -e
          bash scripts/ci/resilient-push.sh \
            "node scripts/integrate-manuelaserra-catalog.js" \
            "chore: Manuela Serra daily refresh ($(date -u +%Y-%m-%d))" \
            data/catalog/manuelaserra-full.json
