# CosMath — My Cosmetics daily price refresh
# ============================================================
# My Cosmetics (mycosmetics.pt): Shopify PT, preços EUR, envia PT. JSON-LD com
# gtin13 REAL → match forte por EAN (como cocooncenter/pharma-gdd).
# Sitemap /sitemap.xml (índice) → sitemap_products_N.xml.
#
# Pipeline:
#   1. scrape-mycosmetics-catalog.js → data/catalog/mycosmetics-full.json
#   2. integrate-mycosmetics-catalog.js (match EAN + pós-processo + inject)

name: My Cosmetics daily refresh

on:
  schedule:
    - cron: '0 8 * * *'
    - cron: '0 16 * * *'   # 3x/dia (regra do user 2026-07-03)
    - cron: '0 0 * * *'   # 3x/dia
  workflow_dispatch:
    inputs:
      limit:
        description: 'Limit (vazio = sem limite)'
        required: false
        default: ''

permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
      NODE_OPTIONS: '--max-old-space-size=4096'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install deps
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Scrape My Cosmetics
        run: |
          if [ -n "${{ github.event.inputs.limit }}" ]; then
            node scripts/scrape-mycosmetics-catalog.js --limit=${{ github.event.inputs.limit }} --concurrency=5 --delay=250
          else
            node scripts/scrape-mycosmetics-catalog.js --concurrency=5 --delay=250
          fi

      - name: Upload scrape artifact (safety-net)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mycosmetics-catalog-${{ github.run_id }}
          path: data/catalog/mycosmetics-full.json
          retention-days: 14

      - name: Integrate into seed
        run: node scripts/integrate-mycosmetics-catalog.js

      - name: Commit changes
        env:
          GIT_AUTHOR_NAME: CosMath Bot
          GIT_AUTHOR_EMAIL: bot@cosmath.pt
          GIT_COMMITTER_NAME: CosMath Bot
          GIT_COMMITTER_EMAIL: bot@cosmath.pt
        run: |
          set -e
          if git diff --quiet -- data/seed-bundle.json demo.html index.html catalogo.html; then
            echo "Nenhuma alteração — nada a fazer."
            exit 0
          fi
          git add data/seed-bundle.json demo.html index.html catalogo.html
          git add -f data/catalog/mycosmetics-full.json 2>/dev/null || true
          DATE=$(date -u +%Y-%m-%d)
          git commit -m "chore: My Cosmetics daily refresh ($DATE)" \
            -m "Auto-update via GitHub Actions. Sem mexer noutras lojas."

      - name: Push to main (resilient — re-integra sobre origin em conflito)
        run: |
          set -e
          bash scripts/ci/resilient-push.sh \
            "node scripts/integrate-mycosmetics-catalog.js" \
            "chore: My Cosmetics daily refresh ($(date -u +%Y-%m-%d))" \
            data/catalog/mycosmetics-full.json
