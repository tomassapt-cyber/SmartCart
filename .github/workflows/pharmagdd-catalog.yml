# GirlMath — Pharma GDD (FR) daily price refresh — 1ª loja europeia
# ============================================================
# pharma-gdd.com (Grande Pharmacie de la Place, França). JSON-LD limpo com
# gtin13 (EAN real ~100%). ~14.7k produtos. Envia para PT (Chronopost) —
# portes internacionais modelados em shipping_zones (ver seed/stores.json).
# Match por EAN (global) → cruza com marcas francesas do nosso catálogo.
#
# Páginas grandes → flat-copy (no scraper) + heap bump evitam OOM; timeout alto.

name: Pharma GDD daily refresh

on:
  schedule:
    # 22h UTC — fim da cadeia diária
    - cron: '0 22 * * *'
    - cron: '0 6 * * *'   # 3x/dia (regra do user 2026-07-03)
    - cron: '0 14 * * *'   # 3x/dia
  workflow_dispatch:
    inputs:
      limit:
        description: 'Limit (vazio = sem limite)'
        required: false
        default: ''

permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
      NODE_OPTIONS: '--max-old-space-size=4096'
      # Medido a 2026-09-24: sem isto, cada integracao gasta 4m40s a
      # regenerar a curadoria da homepage (build-homepage-data) -- trabalho
      # identico em todas as lojas, feito 219x por dia. Com a variavel, a
      # integracao passa de ~5min para ~10s, e o re-integrate do
      # resilient-push deixa de custar 5 minutos por tentativa rejeitada.
      # A homepage e' regenerada uma vez por dia no recommendations.yml.
      COSMATH_SKIP_HP: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # O catalogo vive comprimido no git (13 MB em vez de 100 MB): o
      # .json passava o limite de 100 MB do GitHub e as lojas grandes viam
      # o push recusado com GH001. Ver scripts/ci/seed.sh.
      - name: Descomprimir o catalogo
        run: bash scripts/ci/seed.sh unpack

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install deps
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Scrape Pharma GDD catalog
        run: |
          if [ -n "${{ github.event.inputs.limit }}" ]; then
            node scripts/scrape-pharmagdd-catalog.js --limit=${{ github.event.inputs.limit }} --concurrency=5 --delay=220
          else
            node scripts/scrape-pharmagdd-catalog.js --concurrency=5 --delay=220
          fi

      - name: Upload scrape artifact (safety-net)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pharmagdd-catalog-${{ github.run_id }}
          path: data/catalog/pharmagdd-full.json
          retention-days: 14

      - name: Integrate into seed
        run: node scripts/integrate-pharmagdd-catalog.js

      - name: Commit changes
        env:
          GIT_AUTHOR_NAME: GirlMath Bot
          GIT_AUTHOR_EMAIL: bot@girlmath.pt
          GIT_COMMITTER_NAME: GirlMath Bot
          GIT_COMMITTER_EMAIL: bot@girlmath.pt
        run: |
          set -e
          # O .json é ignorado pelo git — só o .gz é rastreado. Um `git diff`
          # do .json diria SEMPRE "sem alterações", e loja nenhuma publicava nada.
          # Comprimir PRIMEIRO e testar o .gz, que é byte-a-byte determinístico
          # graças ao `gzip -n` (sem -n, o cabeçalho leva a data e o teste dava
          # sempre alteração — 13,4 MB de commit por dia e por loja, sem dados novos).
          bash scripts/ci/seed.sh pack
          if git diff --quiet -- data/seed-bundle.json.gz demo.html; then
            echo "Nenhuma alteração — nada a fazer."
            exit 0
          fi
          git add data/seed-bundle.json.gz demo.html
          git add -f data/catalog/pharmagdd-full.json 2>/dev/null || true
          DATE=$(date -u +%Y-%m-%d)
          git commit -m "chore: Pharma GDD daily refresh ($DATE)" \
            -m "Auto-update via GitHub Actions. Sem mexer noutras lojas."

      - name: Push to main (resilient — re-integra sobre origin em conflito)
        run: |
          set -e
          bash scripts/ci/resilient-push.sh \
            "node scripts/integrate-pharmagdd-catalog.js" \
            "chore: Pharma GDD daily refresh ($(date -u +%Y-%m-%d))" \
            data/catalog/pharmagdd-full.json
