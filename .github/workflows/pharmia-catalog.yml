# CosMath — Pharmia daily price refresh
# ============================================================
# pharmia.pt WooCommerce: JSON-LD sku=CNP + meta product:price:amount; wp-sitemap 125 fichas.
#
# Pipeline:
#   1. scrape-pharmia-catalog.js → data/catalog/pharmia-full.json
#   2. integrate-pharmia-catalog.js (match EAN/CNP + pós-processo + inject)

name: Pharmia daily refresh

on:
  schedule:
    - cron: '55 12 * * *'
    - cron: '55 20 * * *'   # 3x/dia (regra do user 2026-07-03)
    - cron: '55 4 * * *'   # 3x/dia
  workflow_dispatch:
    inputs:
      limit:
        description: 'Limit (vazio = sem limite)'
        required: false
        default: ''
      resume:
        description: 'Retomar do catálogo committed (1 = sim; vazio = scrape completo)'
        required: false
        default: ''

permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
      NODE_OPTIONS: '--max-old-space-size=4096'
      # Medido a 2026-09-24: sem isto, cada integracao gasta 4m40s a
      # regenerar a curadoria da homepage (build-homepage-data) -- trabalho
      # identico em todas as lojas, feito 219x por dia. Com a variavel, a
      # integracao passa de ~5min para ~10s, e o re-integrate do
      # resilient-push deixa de custar 5 minutos por tentativa rejeitada.
      # A homepage e' regenerada uma vez por dia no recommendations.yml.
      COSMATH_SKIP_HP: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install deps
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Scrape Pharmia
        run: |
          RESUME=""
          if [ -n "${{ github.event.inputs.resume }}" ]; then RESUME="--resume"; fi
          if [ -n "${{ github.event.inputs.limit }}" ]; then
            node scripts/scrape-pharmia-catalog.js --limit=${{ github.event.inputs.limit }} --concurrency=3 --delay=400 $RESUME
          else
            node scripts/scrape-pharmia-catalog.js --concurrency=3 --delay=400 $RESUME
          fi

      - name: Upload scrape artifact (safety-net)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pharmia-catalog-${{ github.run_id }}
          path: data/catalog/pharmia-full.json
          retention-days: 14

      - name: Integrate into seed
        run: node scripts/integrate-pharmia-catalog.js

      - name: Commit changes
        env:
          GIT_AUTHOR_NAME: CosMath Bot
          GIT_AUTHOR_EMAIL: bot@cosmath.pt
          GIT_COMMITTER_NAME: CosMath Bot
          GIT_COMMITTER_EMAIL: bot@cosmath.pt
        run: |
          set -e
          if git diff --quiet -- data/seed-bundle.json demo.html; then
            echo "Nenhuma alteração — nada a fazer."
            exit 0
          fi
          git add data/seed-bundle.json demo.html
          git add -f data/catalog/pharmia-full.json 2>/dev/null || true
          DATE=$(date -u +%Y-%m-%d)
          git commit -m "chore: Pharmia daily refresh ($DATE)" \
            -m "Auto-update via GitHub Actions. Sem mexer noutras lojas."

      - name: Push to main (resilient — re-integra sobre origin em conflito)
        run: |
          set -e
          bash scripts/ci/resilient-push.sh \
            "node scripts/integrate-pharmia-catalog.js" \
            "chore: Pharmia daily refresh ($(date -u +%Y-%m-%d))" \
            data/catalog/pharmia-full.json
