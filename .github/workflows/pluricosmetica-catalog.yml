# CosMath — Pluricosmetica daily price refresh
# ============================================================
# pluricosmetica.pt (Magento) NÃO expõe EAN/JSON-LD nas páginas, mas publica um
# feed Google Merchant completo (~2.6k produtos):
#   https://pluricosmetica.pt/feeds/google_export.xml
#
# O scraper é feed-based (1 download, sem raspar página a página → rápido).
# Sem EAN, o integrador casa por FINGERPRINT (marca+nome) com guard de volume
# e entra SÓ como fonte de preço sobre produtos existentes (não cria SKUs).
#
# Pipeline:
#   1. scrape-pluricosmetica-catalog.js   → data/catalog/pluricosmetica-full.json
#   2. integrate-pluricosmetica-catalog.js → match por fingerprint (enrich-only)
#      (inject-seed-into-demo.js corre dentro do integrate → regenera HTML)

name: Pluricosmetica daily refresh

on:
  schedule:
    - cron: '45 2 * * *'      # diário known-only (rápido)
    - cron: '45 10 * * *'
    - cron: '45 18 * * *'
    - cron: '30 4 * * 1'      # SEMANAL (segunda 04h30 UTC) — scan completo --full
  workflow_dispatch:
    inputs:
      limit:
        description: 'Limit (vazio = sem limite, útil para teste)'
        required: false
        default: ''
      full:
        description: 'true = scan completo (descobrir novos matches)'
        required: false
        default: ''

permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
      NODE_OPTIONS: '--max-old-space-size=4096'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install deps
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Scrape Pluricosmetica
        run: |
          if [ -n "${{ github.event.inputs.limit }}" ]; then
            node scripts/scrape-pluricosmetica-catalog.js --limit=${{ github.event.inputs.limit }}
          elif [ "${{ github.event.schedule }}" = "30 4 * * 1" ] || [ -n "${{ github.event.inputs.full }}" ]; then
            node scripts/scrape-pluricosmetica-catalog.js --full --resume
          else
            node scripts/scrape-pluricosmetica-catalog.js
          fi

      - name: Upload scrape artifact (safety-net)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pluricosmetica-catalog-${{ github.run_id }}
          path: data/catalog/pluricosmetica-full.json
          retention-days: 14

      - name: Integrate into seed
        run: node scripts/integrate-pluricosmetica-catalog.js

      - name: Commit changes
        env:
          GIT_AUTHOR_NAME: CosMath Bot
          GIT_AUTHOR_EMAIL: bot@cosmath.pt
          GIT_COMMITTER_NAME: CosMath Bot
          GIT_COMMITTER_EMAIL: bot@cosmath.pt
        run: |
          set -e
          if git diff --quiet -- data/seed-bundle.json demo.html index.html catalogo.html; then
            echo "Nenhuma alteração — nada a fazer."
            exit 0
          fi
          git add data/seed-bundle.json demo.html index.html catalogo.html
          git add -f data/catalog/pluricosmetica-full.json 2>/dev/null || true
          DATE=$(date -u +%Y-%m-%d)
          git commit -m "chore: Pluricosmetica daily refresh ($DATE)" \
            -m "Auto-update via GitHub Actions. Sem mexer noutras lojas."

      - name: Push to main (resilient — re-integra sobre origin em conflito)
        run: |
          set -e
          bash scripts/ci/resilient-push.sh \
            "node scripts/integrate-pluricosmetica-catalog.js" \
            "chore: Pluricosmetica daily refresh ($(date -u +%Y-%m-%d))" \
            data/catalog/pluricosmetica-full.json
