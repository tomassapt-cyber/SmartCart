# CosMath — Power Beauty (loja de COMPARAÇÃO, não cria produtos)
# ============================================================
# powerbeauty.pt (Superpet lda): a MAIOR loja de cosmética do KuantoKusta
# (19.621 produtos "Saúde e Beleza"). PrestaShop; JSON-LD com gtin13=EAN REAL
# → o integrador casa por EAN e entra SÓ como fonte de preço (enrich-only).
#
# O catálogo tem ~22.6k fichas (~1-2h de scan) → padrão DocMorris:
# crons DIÁRIOS em --known-only (refrescam só os URLs das ofertas que já temos,
# rápido) + cron SEMANAL --full --resume (scan completo p/ novos matches).

name: Power Beauty refresh

on:
  # ⚠️ powerbeauty.pt BLOQUEIA IPs de datacenter (como a Notino): o run cloud
  # devolve página-desafio (0 locs no sitemap; anti-vazio guarda). Schedule
  # DESATIVADO — refresh corre do PC (scrape local + integrate + push), padrão
  # Notino. Reativar exigiria proxy residencial.
  # schedule:
  #   - cron: '35 5 * * *'
  #   - cron: '35 13 * * *'
  #   - cron: '35 21 * * *'
  #   - cron: '0 3 * * 2'     # SEMANAL — scan completo --full
  workflow_dispatch:
    inputs:
      limit:
        description: 'Limit (vazio = sem limite, útil para teste)'
        required: false
        default: ''
      full:
        description: 'true = scan completo (descobrir novos matches)'
        required: false
        default: ''

permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
      NODE_OPTIONS: '--max-old-space-size=4096'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install deps
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Scrape Power Beauty
        run: |
          if [ -n "${{ github.event.inputs.limit }}" ]; then
            node scripts/scrape-powerbeauty-catalog.js --limit=${{ github.event.inputs.limit }}
          elif [ "${{ github.event.schedule }}" = "0 3 * * 2" ] || [ -n "${{ github.event.inputs.full }}" ]; then
            node scripts/scrape-powerbeauty-catalog.js --full --resume --concurrency=6 --delay=200
          else
            node scripts/scrape-powerbeauty-catalog.js --known-only --concurrency=6 --delay=200
          fi

      - name: Upload scrape artifact (safety-net)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: powerbeauty-catalog-${{ github.run_id }}
          path: data/catalog/powerbeauty-full.json
          retention-days: 14

      - name: Integrate into seed
        run: node scripts/integrate-powerbeauty-catalog.js

      - name: Commit changes
        env:
          GIT_AUTHOR_NAME: CosMath Bot
          GIT_AUTHOR_EMAIL: bot@cosmath.pt
          GIT_COMMITTER_NAME: CosMath Bot
          GIT_COMMITTER_EMAIL: bot@cosmath.pt
        run: |
          set -e
          if git diff --quiet -- data/seed-bundle.json demo.html index.html catalogo.html; then
            echo "Nenhuma alteração — nada a fazer."
            exit 0
          fi
          git add data/seed-bundle.json demo.html index.html catalogo.html
          git add -f data/catalog/powerbeauty-full.json 2>/dev/null || true
          DATE=$(date -u +%Y-%m-%d)
          git commit -m "chore: Power Beauty refresh ($DATE)" \
            -m "Auto-update via GitHub Actions. Sem mexer noutras lojas."

      - name: Push to main (resilient — re-integra sobre origin em conflito)
        run: |
          set -e
          bash scripts/ci/resilient-push.sh \
            "node scripts/integrate-powerbeauty-catalog.js" \
            "chore: Power Beauty refresh ($(date -u +%Y-%m-%d))" \
            data/catalog/powerbeauty-full.json
