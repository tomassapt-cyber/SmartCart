# CosMath — Primor daily price refresh
# ============================================================
# Ver scripts/scrape-primor-catalog.js (JSON-LD com EAN real; --dermo filtra
# o catalogo grande). Integrador: EAN/fingerprint + cria dermo novos.
name: Primor daily refresh

on:
  schedule:
    # 02h UTC — slot livre; catalogo grande (37k, dermo ~?k)
    - cron: '0 2 * * *'
    - cron: '0 10 * * *'   # 3x/dia (regra do user 2026-07-03)
    - cron: '0 18 * * *'   # 3x/dia
  workflow_dispatch:
    inputs:
      limit:
        description: 'Limit (vazio = sem limite)'
        required: false
        default: ''

permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
      NODE_OPTIONS: '--max-old-space-size=4096'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install deps
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Scrape Primor (dermo)
        run: |
          if [ -n "${{ github.event.inputs.limit }}" ]; then
            node scripts/scrape-primor-catalog.js --dermo --limit=${{ github.event.inputs.limit }} --concurrency=5 --delay=200
          else
            node scripts/scrape-primor-catalog.js --dermo --concurrency=5 --delay=200
          fi

      - name: Upload scrape artifact (safety-net)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: primor-catalog-${{ github.run_id }}
          path: data/catalog/primor-full.json
          retention-days: 14

      - name: Integrate into seed
        run: node scripts/integrate-primor-catalog.js

      - name: Commit changes
        env:
          GIT_AUTHOR_NAME: CosMath Bot
          GIT_AUTHOR_EMAIL: bot@cosmath.pt
          GIT_COMMITTER_NAME: CosMath Bot
          GIT_COMMITTER_EMAIL: bot@cosmath.pt
        run: |
          set -e
          if git diff --quiet -- data/seed-bundle.json demo.html; then
            echo "Nenhuma alteração — nada a fazer."
            exit 0
          fi
          git add data/seed-bundle.json demo.html
          git add -f data/catalog/primor-full.json 2>/dev/null || true
          DATE=$(date -u +%Y-%m-%d)
          git commit -m "chore: Primor daily refresh ($DATE)" \
            -m "Auto-update via GitHub Actions. Sem mexer noutras lojas."

      - name: Push to main (resilient — re-integra sobre origin em conflito)
        run: |
          set -e
          bash scripts/ci/resilient-push.sh \
            "node scripts/integrate-primor-catalog.js" \
            "chore: Primor daily refresh ($(date -u +%Y-%m-%d))" \
            data/catalog/primor-full.json
