# SmartCart — Recomendações por conteúdo (Fase 3)
# ============================================================
# Reconstrói data/recommendations.json (índice de "produtos similares"
# por TF-IDF + cosseno sobre descrição/nome/marca) a partir do
# seed-bundle.json já commitado. NÃO faz scraping e NÃO toca no seed.
#
# Corre 1×/dia (a similaridade é estável, ao contrário dos preços), de
# propósito SEPARADO das crons de preço — para não somar 48s + 11MB de
# churn a cada uma das 9 crons nem pôr o pipeline de preços em risco.
#
# Pipeline:
#   build-recommendations.js   → data/recommendations.json (~11MB, separado)
#   build-descriptions-file.js → data/descriptions.json    (~7MB, separado)
#
# Ambos são índices derivados do seed (texto/relacional), lazy-loaded pelo
# front-end ao abrir um produto — ficam FORA do seed para o manter leve.

name: Content recommendations

on:
  schedule:
    # 05h UTC — depois do grosso das crons nocturnas de preço.
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # O catalogo vive comprimido no git (13 MB em vez de 100 MB): o
      # .json passava o limite de 100 MB do GitHub e as lojas grandes viam
      # o push recusado com GH001. Ver scripts/ci/seed.sh.
      - name: Descomprimir o catalogo
        run: bash scripts/ci/seed.sh unpack

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Sem npm install: build-recommendations.js só usa builtins do Node
      # + scripts/lib locais (sem dependências externas).

      - name: Build recommendations + descriptions + homepage
        run: |
          node scripts/build-recommendations.js
          node scripts/build-descriptions-file.js
          # A curadoria da homepage ("em alta", kits, patrocinados) era
          # regenerada dentro de CADA integracao de loja -- 219 vezes por dia,
          # 4m40s de cada vez, sempre o mesmo trabalho. As lojas passaram a
          # salta-la (COSMATH_SKIP_HP=1) e ela aterra aqui, uma vez por dia,
          # que e' o ritmo a que a curadoria muda.
          node scripts/build-homepage-data.js

      - name: Commit derived indexes
        env:
          GIT_AUTHOR_NAME: GirlMath Bot
          GIT_AUTHOR_EMAIL: bot@girlmath.pt
          GIT_COMMITTER_NAME: GirlMath Bot
          GIT_COMMITTER_EMAIL: bot@girlmath.pt
        run: |
          set -e
          if git diff --quiet -- data/recommendations.json data/descriptions.json data/homepage-data.json; then
            echo "Nenhuma alteração nos índices derivados — nada a fazer."
            exit 0
          fi
          git add data/recommendations.json data/descriptions.json data/homepage-data.json
          DATE=$(date -u +%Y-%m-%d)
          git commit -m "chore: rebuild content indexes ($DATE)" \
            -m "Auto-update via GitHub Actions. Índices derivados do seed (similares + descrições); preços intactos."

      - name: Push (resilient — reaproveita os índices em conflito)
        # Se não houve commit (sem alterações), o push é um no-op "up-to-date".
        # Em conflito com uma cron de preço, o resilient-push adopta o origin
        # mais recente e repõe os TRÊS ficheiros que acabámos de gerar (são os
        # "raw" da lista). Não os volta a gerar (2026-10-16): só este workflow
        # escreve as recomendações e as descrições, a curadoria reposta tem
        # minutos, e uma hora de diferença no seed não muda nada num índice
        # diário. Regenerar custava
        # ~4 min por tentativa e, com ~240 pushes de bots por dia, a corrida
        # perdia-se sempre -- 8 de 8 canceladas entre 08 e 15/10. (Os campos
        # que o inject acrescenta ao homepage-data -- stats, versões, arranque
        # -- são recalculados no build da Vercel; o que vem daqui não conta.)
        run: |
          set -e
          bash scripts/ci/resilient-push.sh \
            "true" \
            "chore: rebuild content indexes ($(date -u +%Y-%m-%d))" \
            data/recommendations.json data/descriptions.json data/homepage-data.json
