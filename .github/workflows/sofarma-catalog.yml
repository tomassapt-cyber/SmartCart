# CosMath — Sofarma daily price refresh
# ============================================================
# JSON-LD por ficha (como a atida). 8.010 URLs no mapa, ~30 min a 4 em paralelo.
# EAN-13 (gtin) E CNP (sku) em 100% da amostra — os melhores dados de todas as
# candidatas avaliadas.
#
# ATENCAO: o site serve em ISO-8859-1. O scraper le os bytes e descodifica em
# latin1; se algum dia se mudar isso, TODOS os nomes acentuados entram
# estragados no catalogo (Avene vira Av?ne).
#
# Pipeline:
#   1. scrape-sofarma-catalog.js → data/catalog/sofarma-full.json
#   2. integrate-sofarma-catalog.js (match EAN/CNP + pós-processo + inject)

name: Sofarma daily refresh

on:
  schedule:
    - cron: '45 4 * * *'
    - cron: '45 12 * * *'   # 3x/dia (regra do user 2026-07-03)
    - cron: '45 20 * * *'   # 3x/dia
  workflow_dispatch:
    inputs:
      limit:
        description: 'Limit (vazio = sem limite)'
        required: false
        default: ''
      resume:
        description: 'Retomar do catálogo committed (1 = sim; vazio = scrape completo)'
        required: false
        default: ''

permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
      NODE_OPTIONS: '--max-old-space-size=4096'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install deps
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Scrape Sofarma
        run: |
          # [2026-07-30] O $RESUME era calculado e NUNCA usado — o botao
          # "Retomar" da interface nao fazia nada. Na Care to Beauty isso
          # custava 57 min de recolha repetida (run 30561862354).
          RESUME=""
          if [ -n "${{ github.event.inputs.resume }}" ]; then RESUME="--resume"; fi
          if [ -n "${{ github.event.inputs.limit }}" ]; then
            node scripts/scrape-sofarma-catalog.js --limit=${{ github.event.inputs.limit }} $RESUME
          else
            node scripts/scrape-sofarma-catalog.js $RESUME
          fi

      - name: Upload scrape artifact (safety-net)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sofarma-catalog-${{ github.run_id }}
          path: data/catalog/sofarma-full.json
          retention-days: 14

      # A recolha demora ~30 min. Guarda-la no seu proprio commit, ANTES da
      # integracao, evita perde-la se o push da integracao perder a corrida
      # contra os ~140 pushes/dia dos outros bots (foi o que aconteceu a
      # Care to Beauty, run 30551673295: 62 min de recolha deitados fora).
      - name: Guardar o catalogo recolhido (antes de integrar)
        env:
          GIT_AUTHOR_NAME: CosMath Bot
          GIT_AUTHOR_EMAIL: bot@cosmath.pt
          GIT_COMMITTER_NAME: CosMath Bot
          GIT_COMMITTER_EMAIL: bot@cosmath.pt
        run: |
          set -e
          git add -f data/catalog/sofarma-full.json
          if git diff --cached --quiet; then echo "sem alteracoes"; exit 0; fi
          git commit -m "chore: Sofarma catalogo ($(date -u +%Y-%m-%d))" \
            -m "So o catalogo; a integracao no seed vem a seguir."
          for i in 1 2 3 4 5; do
            if git push origin HEAD:main; then echo "catalogo guardado"; exit 0; fi
            git fetch origin main && git rebase origin/main || git rebase --abort || true
            sleep $((i * 10))
          done
          echo "AVISO: nao consegui guardar o catalogo; fica o artefacto"

      - name: Integrate into seed
        run: node scripts/integrate-sofarma-catalog.js

      - name: Commit changes
        env:
          GIT_AUTHOR_NAME: CosMath Bot
          GIT_AUTHOR_EMAIL: bot@cosmath.pt
          GIT_COMMITTER_NAME: CosMath Bot
          GIT_COMMITTER_EMAIL: bot@cosmath.pt
        run: |
          set -e
          if git diff --quiet -- data/seed-bundle.json demo.html; then
            echo "Nenhuma alteração — nada a fazer."
            exit 0
          fi
          git add data/seed-bundle.json demo.html
          git add -f data/catalog/sofarma-full.json 2>/dev/null || true
          DATE=$(date -u +%Y-%m-%d)
          git commit -m "chore: Sofarma daily refresh ($DATE)" \
            -m "Auto-update via GitHub Actions. Sem mexer noutras lojas."

      - name: Push to main (resilient — re-integra sobre origin em conflito)
        run: |
          set -e
          bash scripts/ci/resilient-push.sh \
            "node scripts/integrate-sofarma-catalog.js" \
            "chore: Sofarma daily refresh ($(date -u +%Y-%m-%d))" \
            data/catalog/sofarma-full.json
