name: Sonda (temporaria) — endpoints a granel dos IPs do GitHub

# WORKFLOW DE DIAGNOSTICO, PARA APAGAR.
#
# Pergunta a responder: as lojas que bloqueiam os IPs de datacenter nas fichas de
# produto (HTML) bloqueiam tambem o endpoint /products.json? A proteccao anti-bot
# costuma visar a raspagem de HTML e deixar passar JSON, e se for o caso estas
# lojas voltam a funcionar na nuvem SEM proxy nenhum.
#
# Da rede domestica, medido a 2026-09-25:
#   smartbeauty  HTTP 200  total=8108  EAN em 50/50  ~9 KB/produto
#   beleza37     HTTP 200  total=7713  EAN em 40/50  ~7 KB/produto
#   sobeauty     HTTP 200  total=954   EAN em 50/50  ~9 KB/produto
#
# Nao escreve nada: so le e imprime.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Pedir os endpoints e dizer o que veio
        run: |
          set -u
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36'
          for alvo in \
            "smartbeauty|https://smartbeauty.pt/products.json?limit=250" \
            "beleza37|https://beleza37.pt/products.json?limit=250" \
            "sobeauty|https://sobeauty.pt/products.json?limit=250" \
            "powerbeauty|https://www.powerbeauty.pt/products.json?limit=250" \
            "notino|https://www.notino.pt/sitemap.xml" \
            "skin|https://skin.pt/products.json?limit=250" \
            "care2me|https://www.care2me.pt/sitemap.xml" \
            "afarmaciaonline|https://www.afarmaciaonline.pt/sitemap.xml" \
            "fastpharma|https://fastpharma.pt/sitemap/sitemap_web.xml" \
            "docmorris|https://www.docmorris.pt/pt/bio-oil-gel-pele-seca-50ml/p-141278" \
          ; do
            nome="${alvo%%|*}"; url="${alvo#*|}"
            code=$(curl -s -o /tmp/r.txt -w '%{http_code}' --compressed -A "$UA" -H 'Accept: application/json, text/xml, */*' --max-time 30 "$url" || echo 000)
            tam=$(wc -c < /tmp/r.txt)
            total=$(node -e 'try{const d=JSON.parse(require("fs").readFileSync("/tmp/r.txt","utf8"));process.stdout.write(String(d.total_count??(Array.isArray(d.data)?d.data.length:"-")))}catch(e){process.stdout.write("-")}' 2>/dev/null || echo '-')
            locs=$(grep -o '<loc>' /tmp/r.txt 2>/dev/null | wc -l)
            titulo=$(grep -o -i '<title>[^<]*' /tmp/r.txt 2>/dev/null | head -1 | sed 's/<title>//I' | cut -c1-40)
            printf '%-18s HTTP %-4s %8s b  total_count=%-8s locs=%-6s %s\n' "$nome" "$code" "$tam" "$total" "$locs" "$titulo"
            sleep 1
          done
