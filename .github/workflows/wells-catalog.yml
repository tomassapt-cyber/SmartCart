# SmartCart — Wells full catalog refresh
# ============================================================
# Descobre + scrape + INTEGRA todos os produtos da Wells no seed.
# Trigger:
#  - Manual via UI ("Run workflow"), com input de categoria
#  - Cron diário às 14h UTC (queues após Sweetcare das 10h)
#
# Pipeline:
#   1. discover-wells-catalog.js   → data/catalog/wells-urls.json
#   2. scrape-wells-catalog.js     → data/catalog/wells-full.json
#   3. integrate-wells-catalog.js  → merge no seed (atualiza verified_at) +
#      dedup + normalize marcas + regenera demo/index/catalogo.html
#   4. commit + push para main
#
# NOTA: antes, este workflow só fazia scrape e nunca integrava — por isso
# os preços/verified_at da Wells no seed ficavam congelados durante dias.

name: Wells catalog refresh

on:
  schedule:
    - cron: '0 14 * * *'    # Diário às 14h UTC (queues após Sweetcare das 10h)
  workflow_dispatch:
    inputs:
      category:
        description: 'Categoria (skincare, haircare, body, makeup, fragrance, all)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - skincare
          - haircare
          - body
          - makeup
          - fragrance
          - supplements
      limit:
        description: 'Limit (vazio = sem limite, útil para teste)'
        required: false
        default: ''

permissions:
  contents: write
jobs:
  catalog:
    name: Discover & scrape Wells catalog
    runs-on: ubuntu-latest
    timeout-minutes: 300    # 5h max
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install npm dependencies
        run: npm install

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Step 1 — Discover URLs from sitemap
        run: node scripts/discover-wells-catalog.js

      - name: Step 2 — Scrape products
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.category }}" ] && [ "${{ github.event.inputs.category }}" != "all" ]; then
            ARGS="--category=${{ github.event.inputs.category }}"
          fi
          if [ -n "${{ github.event.inputs.limit }}" ]; then
            ARGS="$ARGS --limit=${{ github.event.inputs.limit }}"
          fi
          echo "Running: node scripts/scrape-wells-catalog.js $ARGS"
          node scripts/scrape-wells-catalog.js $ARGS --concurrency=3 --delay=1500

      - name: Upload scraped catalog as artifact (safety-net)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wells-catalog-data
          path: |
            data/catalog/wells-urls.json
            data/catalog/wells-full.json
          retention-days: 30

      - name: Print summary
        run: |
          if [ -f data/catalog/wells-full.json ]; then
            node -e "const d=require('./data/catalog/wells-full.json'); console.log('=== Wells catalog refresh ==='); console.log('Total products:', d.products.length); console.log('Stats:', JSON.stringify(d.stats, null, 2));"
          fi

      - name: Integrate into seed (atualiza verified_at + regenera HTML)
        run: node scripts/integrate-wells-catalog.js

      - name: Commit catalog data
        run: |
          git config user.name "smartcart-bot"
          git config user.email "bot@smartcart.local"
          # Seed + HTML regenerados pelo integrate; + ficheiros raw (gitignored)
          git add data/seed-bundle.json demo.html index.html catalogo.html 2>/dev/null || true
          git add -f data/catalog/wells-urls.json data/catalog/wells-full.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "Nothing to commit"
          else
            CAT="${{ github.event.inputs.category || 'all' }}"
            git commit -m "chore: Wells daily refresh - $CAT ($(date -u +%Y-%m-%d))"
            BRANCH="${GITHUB_REF_NAME}"
            BACKOFFS=(5 15 30 60 120 180 240 300 420 600 900 1200)
            pushed=0
            for i in "${!BACKOFFS[@]}"; do
              attempt=$((i + 1))
              if git push origin "HEAD:${BRANCH}"; then pushed=1; break; fi
              echo "Push falhou (tentativa $attempt), a rebasear contra origin/${BRANCH}..."
              git fetch origin "${BRANCH}" || true
              git rebase --abort 2>/dev/null || true
              if git pull --rebase --autostash origin "${BRANCH}"; then
                if git push origin "HEAD:${BRANCH}"; then pushed=1; break; fi
              else
                git rebase --abort 2>/dev/null || true
                git stash pop 2>/dev/null || true
              fi
              JITTER=$((RANDOM % 10))
              WAIT=$((${BACKOFFS[$i]} + JITTER))
              echo "Falhou tentativa $attempt, a aguardar ${WAIT}s..."
              sleep "$WAIT"
            done
            if [ "$pushed" != "1" ]; then
              echo "ERRO: 12 tentativas falharam — abortando step para tornar visível"
              exit 1
            fi
          fi
