# SmartCart — Wells full catalog refresh
# ============================================================
# Descobre + scrape + INTEGRA todos os produtos da Wells no seed.
# Trigger:
#  - Manual via UI ("Run workflow"), com input de categoria
#  - Cron diário às 14h UTC (queues após Sweetcare das 10h)
#
# Pipeline:
#   1. discover-wells-catalog.js   → data/catalog/wells-urls.json
#   2. scrape-wells-catalog.js     → data/catalog/wells-full.json
#   3. integrate-wells-catalog.js  → merge no seed (atualiza verified_at) +
#      dedup + normalize marcas + regenera demo/index/catalogo.html
#   4. commit + push para main
#
# NOTA: antes, este workflow só fazia scrape e nunca integrava — por isso
# os preços/verified_at da Wells no seed ficavam congelados durante dias.

name: Wells catalog refresh

on:
  schedule:
    - cron: '0 14 * * *'    # Diário às 14h UTC (queues após Sweetcare das 10h)
  # ensaio na nuvem no próprio PR (3 min de leitura, sem publicar)
  pull_request:
    paths:
      - 'scripts/scrape-wells-catalog.js'
      - 'scripts/lib/rotacao-leitura.js'
      - '.github/workflows/wells-catalog.yml'
  workflow_dispatch:
    inputs:
      category:
        description: 'Categoria (skincare, haircare, body, makeup, fragrance, all)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - skincare
          - haircare
          - body
          - makeup
          - fragrance
          - supplements
      limit:
        description: 'Limit (vazio = sem limite, útil para teste)'
        required: false
        default: ''

permissions:
  contents: write
jobs:
  catalog:
    name: Discover & scrape Wells catalog
    runs-on: ubuntu-24.04   # 24/11: o Playwright ainda não tem Chromium para o Ubuntu 26.04 (ubuntu-latest desde 16/11)
    timeout-minutes: 300    # 5h max — a leitura tem orçamento de 255 min (25/11: levava 297 e o job era cortado a integrar)
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
      # Medido a 2026-09-24: sem isto, cada integracao gasta 4m40s a
      # regenerar a curadoria da homepage (build-homepage-data) -- trabalho
      # identico em todas as lojas, feito 219x por dia. Com a variavel, a
      # integracao passa de ~5min para ~10s, e o re-integrate do
      # resilient-push deixa de custar 5 minutos por tentativa rejeitada.
      # A homepage e' regenerada uma vez por dia no recommendations.yml.
      COSMATH_SKIP_HP: '1'

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # O catalogo vive comprimido no git (13 MB em vez de 100 MB): o
      # .json passava o limite de 100 MB do GitHub e as lojas grandes viam
      # o push recusado com GH001. Ver scripts/ci/seed.sh.
      - name: Descomprimir o catalogo
        run: bash scripts/ci/seed.sh unpack

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install npm dependencies
        run: npm install

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Testes offline (rotação e orçamento de tempo)
        run: node scripts/test-rotacao-leitura.cjs

      - name: Step 1 — Discover URLs from sitemap
        run: node scripts/discover-wells-catalog.js

      - name: Memória da rotação (cache)
        uses: actions/cache/restore@v4
        with:
          path: .cache-lojas
          key: rotacao-wells-${{ github.run_id }}
          restore-keys: rotacao-wells-

      - name: Step 2 — Scrape products
        run: |
          # orçamento de 255 min: primeiro o que está há mais tempo sem ser lido; sobram
          # ~40 min dos 300 do job para integrar e gravar (o resto fica para amanhã)
          ARGS="--orcamento-min=255"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            ARGS="--orcamento-min=3"
          fi
          if [ -n "${{ github.event.inputs.category }}" ] && [ "${{ github.event.inputs.category }}" != "all" ]; then
            ARGS="$ARGS --category=${{ github.event.inputs.category }}"
          fi
          if [ -n "${{ github.event.inputs.limit }}" ]; then
            ARGS="$ARGS --limit=${{ github.event.inputs.limit }}"
          fi
          echo "Running: node scripts/scrape-wells-catalog.js $ARGS"
          node scripts/scrape-wells-catalog.js $ARGS --concurrency=3 --delay=1500

      - name: Guardar a memória da rotação
        if: always() && github.event_name != 'pull_request' && hashFiles('.cache-lojas/wells-lidas.json') != ''
        uses: actions/cache/save@v4
        with:
          path: .cache-lojas
          key: rotacao-wells-${{ github.run_id }}

      - name: Upload scraped catalog as artifact (safety-net)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wells-catalog-data
          path: |
            data/catalog/wells-urls.json
            data/catalog/wells-full.json
          retention-days: 30

      - name: Print summary
        run: |
          if [ -f data/catalog/wells-full.json ]; then
            node -e "const d=require('./data/catalog/wells-full.json'); console.log('=== Wells catalog refresh ==='); console.log('Total products:', d.products.length); console.log('Stats:', JSON.stringify(d.stats, null, 2));"
          fi

      # o ensaio do PR integra a seco (mostra que o ficheiro parcial integra) e não publica
      - name: Integrate into seed (atualiza verified_at + regenera HTML)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            node scripts/integrate-wells-catalog.js --dry-run
          else
            node scripts/integrate-wells-catalog.js
          fi

      - name: Commit catalog data
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "smartcart-bot"
          git config user.email "bot@smartcart.local"
          # Seed + HTML regenerados pelo integrate; + ficheiros raw (gitignored)
          bash scripts/ci/seed.sh pack
          git add data/seed-bundle.json.gz demo.html
          git add -f data/catalog/wells-urls.json data/catalog/wells-full.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "Nothing to commit"
          else
            CAT="${{ github.event.inputs.category || 'all' }}"
            git commit -m "chore: Wells daily refresh - $CAT ($(date -u +%Y-%m-%d))"
            bash scripts/ci/resilient-push.sh \
              "node scripts/integrate-wells-catalog.js" \
              "chore: Wells daily refresh - $CAT ($(date -u +%Y-%m-%d))" \
              data/catalog/wells-urls.json data/catalog/wells-full.json
          fi
