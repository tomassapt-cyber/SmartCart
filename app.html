<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>CosMath · Catálogo (beta BD)</title>
<meta name="theme-color" content="#cebfee" />
<link rel="icon" type="image/svg+xml" href="/icon.svg" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Cormorant+Garamond:ital,wght@1,500&display=swap" rel="stylesheet" />
<style>
/* ============================================================
   FASE 2 v2 (2026-07-24): catálogo servido pela BD.
   ~16KB vs 73MB — pesquisa server-side, paginação, comparação de
   ofertas em folha inferior, ordenação por popularidade (n_stores,
   migration 005) com fallback para nome enquanto a 005 não for
   aplicada. Leitura anon pública (RLS); escrita vedada.
   ============================================================ */
:root{--text:#1c1917;--text-soft:#6b6560;--muted:#9a8f86;--gold:#c8913c;}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:"Inter",system-ui,sans-serif;color:var(--text);font-size:15px;line-height:1.5;
  background:linear-gradient(180deg,#cebfee 0,#dbcff2 220px,#efe8f9 520px,#fff 900px) no-repeat;
  background-color:#fff;min-height:100vh;
  padding-bottom:calc(24px + env(safe-area-inset-bottom));
}
.wrap{max-width:1080px;margin:0 auto;padding:18px 16px}
header{display:flex;align-items:baseline;gap:10px;margin:6px 0 14px}
.logo{font-weight:800;font-size:22px;letter-spacing:-.02em}
.logo em{font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-weight:500}
.beta{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-soft);background:rgba(255,255,255,.7);padding:3px 8px;border-radius:999px}
.back{margin-left:auto;font-size:12.5px;color:var(--text-soft);text-decoration:none}
.searchbar input{
  width:100%;min-height:48px;border:1px solid rgba(120,90,170,.18);border-radius:14px;
  padding:0 16px;font:inherit;font-size:16px;background:rgba(255,255,255,.85);outline:none;
}
.searchbar input:focus{border-color:#9b7fd4;background:#fff}
.meta{font-size:12px;color:var(--text-soft);margin:10px 2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px 12px;margin-top:6px}
.card{
  background:rgba(255,255,255,.86);border:1px solid rgba(120,90,170,.10);border-radius:16px;
  padding:12px;display:flex;flex-direction:column;box-shadow:0 3px 12px rgba(74,50,110,.05);cursor:pointer;
}
.card-img{height:120px;display:flex;align-items:center;justify-content:center;margin-bottom:8px}
.card-img img{max-width:88%;max-height:100%;object-fit:contain;mix-blend-mode:multiply}
.card-ini{font-family:"Cormorant Garamond",Georgia,serif;font-size:38px;color:var(--muted)}
.card-brand{font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);font-weight:600}
.card-name{font-size:13px;font-weight:600;line-height:1.3;margin:2px 0 8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:34px}
.card-price{margin-top:auto;font-size:16px;font-weight:800}
.card-store{font-size:11px;color:var(--text-soft)}
.card-n{font-size:10.5px;color:var(--muted);margin-top:2px}
.more{display:block;margin:22px auto 8px;min-height:48px;padding:0 28px;border:none;border-radius:999px;background:var(--text);color:#fff;font:inherit;font-weight:700;font-size:14px}
.more[disabled]{opacity:.4}
.empty{margin:34px 8px;color:var(--text-soft);text-align:center}
.spin{margin:30px auto;width:26px;height:26px;border:3px solid rgba(120,90,170,.2);border-top-color:#9b7fd4;border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
/* folha de comparação */
.sheet{position:fixed;inset:0;z-index:100;background:rgba(28,25,23,.45);display:flex;align-items:flex-end}
.sheet[hidden]{display:none}
.sheet-card{background:#fff;width:100%;max-height:78vh;border-radius:22px 22px 0 0;padding:18px 18px calc(20px + env(safe-area-inset-bottom));overflow-y:auto}
.sheet-head{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.sheet-img{width:56px;height:56px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.sheet-img img{max-width:100%;max-height:100%;object-fit:contain;mix-blend-mode:multiply}
.sheet-brand{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);font-weight:600}
.sheet-name{font-size:14.5px;font-weight:700;line-height:1.25}
.sheet-x{margin-left:auto;background:none;border:none;font-size:22px;color:var(--muted);min-width:44px;min-height:44px}
.offer{display:flex;align-items:center;gap:10px;padding:11px 4px;border-top:1px solid #f0ebe3;text-decoration:none;color:inherit;min-height:48px}
.offer:first-of-type{border-top:none}
.offer-store{flex:1;font-size:13.5px;font-weight:600}
.offer-price{font-size:15px;font-weight:800}
.offer-best .offer-price{color:#0f766e}
.offer-best .offer-store::after{content:" · melhor preço";font-size:10px;color:#0f766e;font-weight:700}
.offer-go{font-size:12px;color:var(--text-soft)}
.offer-l{flex:1;min-width:0}
.offer-ship{font-size:11px;color:var(--muted)}
.offer-tot{font-size:11px;color:var(--text-soft)}
.offer-besttot .offer-tot{color:#0f766e;font-weight:700}
.sheet-note{font-size:10.5px;color:var(--muted);margin-top:10px;text-align:center}
.vol-chips{display:flex;gap:6px;flex-wrap:wrap;margin:2px 0 10px}
.vol-chip{border:1px solid rgba(120,90,170,.22);background:#fff;border-radius:999px;padding:7px 13px;font:inherit;font-size:12px;font-weight:600;color:var(--text-soft);min-height:36px}
.vol-chip.on{background:var(--text);color:#fff;border-color:var(--text)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">Cos<em>Math</em></div>
    <span class="beta">beta · base de dados</span>
    <a class="back" href="/">← site principal</a>
  </header>
  <div class="searchbar">
    <label for="q" class="sr-only" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Pesquisar produto ou marca</label>
    <input id="q" type="search" placeholder="Pesquisa produto ou marca… (ex.: anthelios, cerave)" autocomplete="off" aria-label="Pesquisar produto ou marca" />
  </div>
  <div class="meta" id="meta" role="status" aria-live="polite">A carregar…</div>
  <div class="grid" id="grid"></div>
  <div class="spin" id="spin" hidden></div>
  <div class="empty" id="empty" hidden>Sem resultados — tenta outro termo.</div>
  <button class="more" id="more" hidden>Carregar mais</button>
</div>

<div class="sheet" id="sheet" hidden>
  <div class="sheet-card" role="dialog" aria-modal="true" aria-labelledby="sh-name">
    <div class="sheet-head">
      <div class="sheet-img" id="sh-img"></div>
      <div><div class="sheet-brand" id="sh-brand"></div><div class="sheet-name" id="sh-name"></div></div>
      <button class="sheet-x" id="sh-x" aria-label="Fechar">×</button>
    </div>
    <div class="vol-chips" id="sh-chips" hidden></div>
    <div id="sh-offers"></div>
  </div>
</div>

<script>
/* Catálogo direto da BD (Fase 2 v2). Leitura pública (anon); escrita vedada
   por RLS. Ordenação: n_stores desc (migration 005) com fallback p/ nome. */
const SB = 'https://sqjtkwtoaudmfmexreqk.supabase.co';
const KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNxanRrd3RvYXVkbWZtZXhyZXFrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NTI4NjcsImV4cCI6MjA5NDQyODg2N30.V6V_qyYXjO39xRM8vuoF8gHq9gvpYRN8u0GNijywr20';
const PAGE = 24;
const state = { q: '', offset: 0, busy: false, done: false, total: null, orderPop: true, varEmbed: true, items: [] };

const esc = s => String(s || '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = n => '€' + Number(n).toFixed(2).replace('.', ',');
const safeUrl = u => { const s = String(u || ''); return /^https?:\/\//i.test(s) ? s : '#'; };
let STORES = {};   // slug → {name, ship, free} (carregado 1× da BD)
const storeName = s => (STORES[s] && STORES[s].name) || s.replace(/(^|[-_])([a-z])/g, (_, a, b) => (a ? ' ' : '') + b.toUpperCase());
async function loadStores() {
  try {
    const r = await fetch(SB + '/rest/v1/stores?select=slug,name,shipping_mainland,free_shipping_threshold', { headers: { apikey: KEY, Authorization: 'Bearer ' + KEY } });
    for (const st of await r.json()) STORES[st.slug] = { name: st.name, ship: st.shipping_mainland, free: st.free_shipping_threshold };
  } catch (e) { /* sem portes — a folha degrada para só-preços */ }
}
function shipFor(slug, price) {
  const st = STORES[slug];
  if (!st || st.ship == null) return { ship: null, total: price, label: 'portes n/d' };
  const gratis = st.free != null && price >= st.free;
  const ship = gratis ? 0 : Number(st.ship);
  const label = gratis ? 'portes grátis ✓' : ('+ portes ' + fmt(ship) + (st.free != null ? ' · grátis ≥ ' + fmt(st.free) : ''));
  return { ship, total: price + ship, label };
}

async function fetchPage(first) {
  const p = new URLSearchParams();
  p.set('select', 'ean,name,brand,image_url,offers!offers_ean_fkey!inner(price,store_slug,url,in_stock)' + (state.varEmbed ? ',offer_variants(volume_ml,price,store_slug,url,in_stock)' : ''));
  p.set('offers.in_stock', 'eq.true');
  p.set('offers.order', 'price.asc');
  p.set('order', state.orderPop ? 'n_stores.desc.nullslast,ean.asc' : 'name.asc,ean.asc');
  p.set('limit', PAGE);
  p.set('offset', state.offset);
  if (state.q) {
    const toks = state.q.replace(/[%,()\\]/g, ' ').split(/\s+/).filter(Boolean).slice(0, 6);
    if (toks.length === 1) p.set('or', `(name.ilike.*${toks[0]}*,brand.ilike.*${toks[0]}*)`);
    else if (toks.length) p.set('and', '(' + toks.map(tk => `or(name.ilike.*${tk}*,brand.ilike.*${tk}*)`).join(',') + ')');
  }
  const headers = { apikey: KEY, Authorization: 'Bearer ' + KEY };
  if (first) headers.Prefer = 'count=exact';
  const r = await fetch(`${SB}/rest/v1/products?${p}`, { headers });
  if (!r.ok) {
    // fallbacks silenciosos por migration ausente: 1º sem variantes (006),
    // depois sem ordenação por popularidade (005)
    if (r.status === 400 && state.varEmbed) { state.varEmbed = false; return fetchPage(first); }
    if (r.status === 400 && state.orderPop) { state.orderPop = false; return fetchPage(first); }
    throw new Error('HTTP ' + r.status);
  }
  if (first) {
    const cr = r.headers.get('content-range');
    if (cr && cr.includes('/')) state.total = parseInt(cr.split('/')[1], 10) || null;
  }
  return r.json();
}

function card(pr, idx) {
  const offs = (pr.offers || []).filter(o => o.price > 0);
  if (!offs.length) return '';
  const best = offs[0];
  const ini = (pr.brand || '?').split(' ').map(w => w[0] || '').slice(0, 2).join('');
  const img = pr.image_url
    ? `<img src="${esc(pr.image_url)}" alt="" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'card-ini',textContent:'${esc(ini)}'}))">`
    : `<span class="card-ini">${esc(ini)}</span>`;
  return `<div class="card" data-idx="${idx}" role="button" tabindex="0" aria-label="Comparar ${esc((pr.brand || '') + ' ' + (pr.name || ''))}">
    <div class="card-img">${img}</div>
    <div class="card-brand">${esc(pr.brand || '')}</div>
    <div class="card-name">${esc(pr.name || '')}</div>
    <div class="card-price">desde ${fmt(best.price)}</div>
    <div class="card-store">@ ${esc(storeName(best.store_slug))}</div>
    <div class="card-n">${offs.length} loja${offs.length === 1 ? '' : 's'} a comparar</div>
  </div>`;
}

function renderSheetOffers(rows) {
  const comPortes = rows.map(o => ({ ...o, s: shipFor(o.store_slug, o.price) }));
  const melhorTotal = Math.min(...comPortes.map(o => o.s.total));
  document.getElementById('sh-offers').innerHTML = comPortes.map((o, i) => `
    <a class="offer ${i === 0 ? 'offer-best' : ''} ${o.s.total === melhorTotal ? 'offer-besttot' : ''}" href="${esc(safeUrl(o.url))}" target="_blank" rel="noopener">
      <span class="offer-l">
        <span class="offer-store">${esc(storeName(o.store_slug))}</span><br>
        <span class="offer-ship">${o.s.label}</span>
      </span>
      <span style="text-align:right">
        <span class="offer-price">${fmt(o.price)}</span><br>
        <span class="offer-tot">${o.s.ship == null ? '' : 'total ' + fmt(o.s.total)}${o.s.total === melhorTotal && o.s.ship != null ? ' · melhor c/ portes' : ''}</span>
      </span>
      <span class="offer-go">↗</span>
    </a>`).join('') + '<div class="sheet-note">portes para Portugal continental, 1 produto · na compra de vários, o cabaz do site principal otimiza os portes</div>';
}
function logSearchEvent(ean) {
  try {
    fetch(SB + '/rest/v1/search_events', {
      method: 'POST',
      headers: { apikey: KEY, Authorization: 'Bearer ' + KEY, 'Content-Type': 'application/json', Prefer: 'return=minimal' },
      body: JSON.stringify({ term: (state.q || '').toLowerCase().slice(0, 64) || null, ean: String(ean) }),
    }).catch(() => {});
  } catch (e) { /* nunca propaga */ }
}
function openSheet(pr) {
  logSearchEvent(pr.ean);
  const offs = (pr.offers || []).filter(o => o.price > 0);
  document.getElementById('sh-brand').textContent = pr.brand || '';
  document.getElementById('sh-name').textContent = pr.name || '';
  document.getElementById('sh-img').innerHTML = pr.image_url ? `<img src="${esc(pr.image_url)}" alt="">` : '';
  // chips de volume (se a 006 estiver viva e houver variantes)
  const vars = (pr.offer_variants || []).filter(v => v.price > 0 && v.in_stock !== false);
  const vols = [...new Set(vars.map(v => Number(v.volume_ml)))].sort((a, b) => a - b);
  const chipsEl = document.getElementById('sh-chips');
  if (vols.length >= 2) {
    chipsEl.hidden = false;
    chipsEl.innerHTML = ['<button class="vol-chip on" data-vol="">melhor de cada loja</button>']
      .concat(vols.map(v => `<button class="vol-chip" data-vol="${v}">${v} ml</button>`)).join('');
    chipsEl.onclick = (e) => {
      const b = e.target.closest('.vol-chip'); if (!b) return;
      chipsEl.querySelectorAll('.vol-chip').forEach(x => x.classList.toggle('on', x === b));
      const vol = b.dataset.vol;
      if (!vol) renderSheetOffers(offs);
      else {
        const porLoja = new Map();
        for (const v of vars) if (Number(v.volume_ml) === Number(vol)) { const cur = porLoja.get(v.store_slug); if (!cur || v.price < cur.price) porLoja.set(v.store_slug, v); }
        renderSheetOffers([...porLoja.values()].sort((a, b) => a.price - b.price));
      }
    };
  } else { chipsEl.hidden = true; chipsEl.innerHTML = ''; }
  renderSheetOffers(offs);
  document.getElementById('sheet').hidden = false;
  document.body.style.overflow = 'hidden';
}
function closeSheet() { document.getElementById('sheet').hidden = true; document.body.style.overflow = ''; }
document.getElementById('sh-x').onclick = closeSheet;
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !document.getElementById('sheet').hidden) closeSheet(); });
document.getElementById('sheet').addEventListener('click', e => { if (e.target === document.getElementById('sheet')) closeSheet(); });
function activateCard(el) { if (el) openSheet(state.items[parseInt(el.dataset.idx, 10)]); }
document.getElementById('grid').addEventListener('click', e => activateCard(e.target.closest('.card')));
document.getElementById('grid').addEventListener('keydown', e => {
  if (e.key === 'Enter' || e.key === ' ') { const c = e.target.closest('.card'); if (c) { e.preventDefault(); activateCard(c); } }
});

let pending = null;
async function load(reset) {
  if (state.busy) { if (reset) pending = true; return; }
  state.busy = true;
  document.getElementById('spin').hidden = false;
  document.getElementById('more').hidden = true;
  if (reset) { state.offset = 0; state.done = false; state.total = null; state.items = []; document.getElementById('grid').innerHTML = ''; }
  try {
    const t0 = performance.now();
    const rows = await fetchPage(reset);
    const ms = Math.round(performance.now() - t0);
    const base = state.items.length;
    state.items.push(...rows);
    document.getElementById('grid').insertAdjacentHTML('beforeend', rows.map((r, i) => card(r, base + i)).join(''));
    state.offset += rows.length;
    state.done = rows.length < PAGE;
    const tot = state.total != null ? ` de ${state.total.toLocaleString('pt-PT')}` : '';
    document.getElementById('meta').textContent = `${state.offset}${tot} produto${state.offset === 1 ? '' : 's'}${state.q ? ` para “${state.q}”` : ''} · BD em ${ms}ms${state.orderPop ? ' · por popularidade' : ''}`;
    document.getElementById('empty').hidden = state.offset > 0;
    document.getElementById('more').hidden = state.done;
  } catch (e) {
    document.getElementById('meta').textContent = 'Erro a falar com a BD: ' + e.message;
  }
  document.getElementById('spin').hidden = true;
  state.busy = false;
  if (pending) { pending = null; load(true); }
}

let deb;
document.getElementById('q').addEventListener('input', (e) => {
  clearTimeout(deb);
  deb = setTimeout(() => { state.q = e.target.value.trim(); load(true); }, 350);
});
document.getElementById('more').addEventListener('click', () => load(false));
async function probeSchema() {
  // fixa as flags com 2 probes baratos (mesmo padrão do push-catalog-to-db.js);
  // o fallback-por-400 do fetchPage fica como rede de segurança.
  try {
    const [a, b] = await Promise.all([
      fetch(SB + '/rest/v1/products?select=n_stores&limit=0', { headers: { apikey: KEY, Authorization: 'Bearer ' + KEY } }),
      fetch(SB + '/rest/v1/offer_variants?select=ean&limit=0', { headers: { apikey: KEY, Authorization: 'Bearer ' + KEY } }),
    ]);
    state.orderPop = a.ok;       // 005 aplicada?
    state.varEmbed = b.ok;       // 006 aplicada?
  } catch (e) { /* offline → deixa os defaults e o fallback trata */ }
}
(async () => { await Promise.all([loadStores(), probeSchema()]); load(true); })();
</script>
</body>
</html>
