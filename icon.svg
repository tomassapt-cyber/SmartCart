<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- CosMath PWA icon — aurora (2026-07-25): letras com gradiente rosa→roxo→azul; "Cos" direito + "Math" itálico, ambos Cormorant Garamond -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fdf8ff"/>
      <stop offset="1" stop-color="#e9ddf5"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0.15" x2="1" y2="0.9">
      <stop offset="0" stop-color="#e0559b"/>
      <stop offset="0.5" stop-color="#8a4fd0"/>
      <stop offset="1" stop-color="#3f7fe0"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <text x="256" y="222" font-family="'Cormorant Garamond', Georgia, serif" font-size="142" font-weight="600" fill="url(#txt)" text-anchor="middle">Cos</text>
  <text x="256" y="382" font-family="'Cormorant Garamond', Georgia, serif" font-size="172" font-weight="600" font-style="italic" letter-spacing="-1" fill="url(#txt)" text-anchor="middle">Math</text>
</svg>
